<!DOCTYPE html>
<html><head><title>Migrate SpecialEd Data</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px;">
<h2>Special Ed Card Migration</h2>
<p>This will shift res2-res6 to res3-res8 and insert CADRE (res2) and IDEA (res4).</p>
<button id="loginBtn" onclick="doLogin()" style="padding:10px 20px;font-size:1rem;cursor:pointer;">Sign In with Google</button>
<pre id="log" style="background:#f1f5f9;padding:16px;border-radius:8px;margin-top:16px;white-space:pre-wrap;"></pre>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
  authDomain: "ldah-932d5.firebaseapp.com",
  projectId: "ldah-932d5"
});
var db = firebase.firestore();
var log = document.getElementById('log');

function doLogin() {
  var provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(function(result) {
    log.textContent = 'Signed in as ' + result.user.email + '\nRunning migration...\n';
    runMigration();
  }).catch(function(err) {
    log.textContent = 'Login error: ' + err.message;
  });
}

async function runMigration() {
  try {
    var doc = await db.collection('pageContent').doc('specialed').get();
    if (!doc.exists) { log.textContent += 'ERROR: specialed doc not found'; return; }
    var d = doc.data();
    var resFields = Object.keys(d).filter(function(k) { return k.startsWith('res'); }).sort();
    log.textContent += 'Current fields: ' + resFields.join(', ') + '\n\n';

    var update = {};
    var suffixes = ['Photo', 'Title', 'Desc'];

    // res6 -> res8
    suffixes.forEach(function(s) { if (d['res6'+s] !== undefined) update['res8'+s] = d['res6'+s]; });
    // res5 -> res7
    suffixes.forEach(function(s) { if (d['res5'+s] !== undefined) update['res7'+s] = d['res5'+s]; });
    // res4 -> res6
    suffixes.forEach(function(s) { if (d['res4'+s] !== undefined) update['res6'+s] = d['res4'+s]; });
    // res3 -> res5
    suffixes.forEach(function(s) { if (d['res3'+s] !== undefined) update['res5'+s] = d['res3'+s]; });
    // res2 -> res3
    suffixes.forEach(function(s) { if (d['res2'+s] !== undefined) update['res3'+s] = d['res2'+s]; });

    // New CADRE = res2
    update.res2Photo = '';
    update.res2Title = 'CADRE \u2014 Dispute Resolution in Special Education';
    update.res2Desc = 'CADRE is a national center that helps families and schools prevent and resolve disagreements related to special education services. Find free guidance, resources, and information about your options.';

    // New IDEA = res4
    update.res4Photo = '';
    update.res4Title = 'IDEA \u2014 Individuals with Disabilities Education Act';
    update.res4Desc = 'The federal law that ensures children with disabilities receive a free appropriate public education and access to special education services. Learn about your rights and protections.';

    log.textContent += 'Updating fields: ' + Object.keys(update).sort().join(', ') + '\n\n';

    await db.collection('pageContent').doc('specialed').update(update);
    log.textContent += 'DONE! Migration complete. Refresh the special education page to verify.';
    document.getElementById('loginBtn').style.display = 'none';
  } catch (err) {
    log.textContent += 'ERROR: ' + err.message;
  }
}
</script>
</body></html>
