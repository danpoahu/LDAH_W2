<script>
const DECK_ID='cert-bronze-4';
const L={tier:'bronze',lesson:'Bronze Lesson 4',title:'Child Find and FAPE'};
const B4I=(d,c='#0E7490',s=26)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const B4_SEARCH='<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>';
const B4_PIN='<path d="M12 21s-6.5-6.2-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>';
const B4_CLIP='<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 12l2 2 4-4"/><path d="M9 17h6"/>';
const B4_TICK='<svg viewBox="0 0 24 24"><path d="M5 12 L10 17 L19 7"/></svg>';
const b4on=async(sel,i,pad=6)=>{const e=typeof i==='number'?all(sel)[i]:q(sel);e.classList.add('on');spot(e,pad);return e};

const SC=[
COVER({...L,title:'Child Find and Free Appropriate Public Education (FAPE)',
 sub:'How schools find children who may need help, and what a fair, complete evaluation looks like.',
 say:'Aloha, and welcome to Lesson 4, the last lesson in Bronze, the Foundations level of the L D A H Certification Program. Today is about how a child gets found, referred, and evaluated, and the rights you have along the way.'}),

{html:()=>HEAD('Two big ideas','FAPE starts with finding the child')+`<div class="b4-letters">
 <div class="b4-lt b4-f"><b>F</b><span>Free</span></div><div class="b4-lt"><b>A</b><span>Appropriate</span></div><div class="b4-lt"><b>P</b><span>Public</span></div><div class="b4-lt"><b>E</b><span>Education</span></div></div>
 <div class="b4-find"><i>${B4I(B4_SEARCH,'#fff',36)}</i><div>Child Find<small>The school’s job of finding children who may have disabilities</small></div></div>`+PTS([
 '<b>FAPE</b> = <b>Free Appropriate Public Education</b>.',
 'It is what special education under <b>IDEA</b> is built to provide.',
 'A child can’t be served until the child is <b>found</b>. That is <b>Child Find</b>.'],170),
 steps:[
 {say:'This lesson’s title names two ideas. The first is FAPE. Let’s spell it out. F is for Free. A is for Appropriate. P is for Public. E is for Education. Free Appropriate Public Education.',li:0,act:async()=>{for(const e of all('.b4-lt')){e.classList.add('on');await wait(700)}}},
 {say:'FAPE is what special education under the federal law, I D E A, is built to provide.',li:1,act:async()=>{spot(q('.b4-letters'),8)}},
 {say:'But a child can’t receive help until someone notices the child may need it. That is the second idea, and the focus of today: Child Find.',li:2,act:async()=>{spot(null);const f=q('.b4-find');f.classList.add('on');await wait(300);spot(f,6)}}]},

{html:()=>HEAD('Child Find','Identify, locate, evaluate')+`<div class="b4-verbs">
 <div class="b4-verb"><i>${B4I(B4_SEARCH,'#0E7490',40)}</i><h3>Identify</h3><p>Notice children who may have a disability</p></div>
 <div class="b4-verb"><i>${B4I(B4_PIN,'#0E7490',40)}</i><h3>Locate</h3><p>Reach the children, wherever they are</p></div>
 <div class="b4-verb"><i>${B4I(B4_CLIP,'#0E7490',40)}</i><h3>Evaluate</h3><p>Look closely at what each child needs</p></div></div>
 <div class="b4-loop"><svg viewBox="0 0 676 150" width="676" height="150"><path d="M106 6 C106 80 180 110 338 110 C496 110 570 80 570 6" fill="none" stroke="#F97316" stroke-width="4" stroke-dasharray="10 8"/><path d="M558 22 L570 4 L582 22" fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="b4-tag">An ongoing duty</div></div>`+PTS([
 'Under <b>IDEA</b>, school districts must <b>identify</b>, <b>locate</b> and <b>evaluate</b> children who may have disabilities.',
 'This is called <b>Child Find</b>.',
 'It is an <b>ongoing legal obligation</b>, not a one-time event.',
 'It is the school’s duty. Not something you have to earn.'],160),
 steps:[
 {say:'Under I D E A, school districts have a legal obligation to do three things for children who may have disabilities.',li:0},
 {say:'Identify them.',act:()=>b4on('.b4-verb',0)},
 {say:'Locate them.',act:()=>b4on('.b4-verb',1)},
 {say:'And evaluate them.',act:()=>b4on('.b4-verb',2)},
 {say:'Together, these three duties are known as Child Find.',li:1,act:async()=>{spot(q('.b4-verbs'),8)}},
 {say:'And notice the word ongoing. Child Find is not a single event, or a once-in-a-while campaign. It is a continuing legal obligation.',li:2,act:async()=>{spot(null);q('.b4-loop').classList.add('on')}},
 {say:'That matters for you. Finding children who may need help is the school district’s duty. You do not have to prove your child deserves to be looked at.',li:3}]},

{html:()=>HEAD('The rule behind it','Policies and procedures')+`<div class="b4-binder">
 <div class="b4-ring" style="top:80px"></div><div class="b4-ring" style="top:238px"></div><div class="b4-ring" style="top:360px"></div>
 <h4>Child Find Policies and Procedures</h4><div class="b4-cite">School district · Federal rule 34 C.F.R. §300.111</div>
 <div class="ln"></div><div class="ln" style="width:86%"></div><div class="ln" style="width:72%"></div>
 <div class="b4-quote">Ensure that <mark class="b4-m1">all children with disabilities</mark> needing special education are <mark class="b4-m2">identified, located, and evaluated.</mark></div>
 <div class="ln" style="width:90%"></div><div class="ln" style="width:64%"></div>
 <div class="b4-all"><span class="chip coral">All children</span> <span class="chip">Written policies</span> <span class="chip sand">Clear procedures</span></div></div>`+PTS([
 'Federal rule: <b>34 C.F.R. §300.111</b>.',
 'Every district must have <b>policies and procedures</b> for Child Find.',
 'Their goal: <b>all</b> children with disabilities needing special education are identified, located and evaluated.'],170),
 steps:[
 {say:'Child Find is written into the federal regulations, at [34 C.F.R. §300.111|thirty four C F R, section three hundred point one one one].',li:0,act:async()=>{spot(q('.b4-cite'),6)}},
 {say:'That rule says school districts must have policies and procedures. Written plans for how they will do this work.',li:1,act:async()=>{spot(q('.b4-binder h4'),8)}},
 {say:'And the purpose of those policies is to make sure that all children with disabilities who need special education are identified, located, and evaluated.',li:2,act:async()=>{spot(null);q('.b4-quote').classList.add('on');q('.b4-m1').classList.add('on');await wait(900);q('.b4-m2').classList.add('on')}},
 {say:'All children. Not only the ones whose parents speak up the loudest.',act:async()=>{q('.b4-all').classList.add('on');spot(q('.b4-all'),6)}}]},

{html:()=>HEAD('Referral for evaluation','Who can start it')+`
 <div class="b4-who b4-par" style="top:150px"><i>${B4I('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>','#fff')}</i>Parents</div>
 <div class="b4-who" style="top:270px"><i>${B4I('<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>')}</i>Teachers</div>
 <div class="b4-who" style="top:390px"><i>${B4I('<path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>')}</i>Administrators</div>
 <div class="b4-who" style="top:510px"><i>${B4I('<path d="M12 5v14M5 12h14"/>')}</i>Medical professionals</div>
 <svg class="b4-wires" viewBox="0 0 150 450"><path class="b4-w" d="M0 46 C80 46 70 210 150 210"/><path class="b4-w" d="M0 166 C80 166 70 210 150 210"/><path class="b4-w" d="M0 286 C80 286 70 210 150 210"/><path class="b4-w" d="M0 406 C80 406 70 210 150 210"/></svg>
 <div class="b4-ref"><h4>Referral for evaluation</h4><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:85%"></div></div>`+PTS([
 'A <b>referral</b> asks the school to evaluate a child.',
 'It may come from <b>parents</b>, <b>teachers</b>, <b>administrators</b> or <b>medical professionals</b>.',
 'You do not need anyone’s permission to refer your own child.'],180),
 steps:[
 {say:'So how does an evaluation actually start? Usually with a referral. A referral is a request for the school to evaluate a child.',li:0,act:async()=>{const r=q('.b4-ref');r.classList.add('on');spot(r,6)}},
 {say:'A referral may be started by parents.',li:1,act:async()=>{const w=all('.b4-wires path');const e=all('.b4-who')[0];e.classList.add('on');w[0].classList.add('on');spot(e,6)}},
 {say:'By teachers.',act:async()=>{const e=all('.b4-who')[1];e.classList.add('on');all('.b4-wires path')[1].classList.add('on');spot(e,6)}},
 {say:'By administrators, like a principal.',act:async()=>{const e=all('.b4-who')[2];e.classList.add('on');all('.b4-wires path')[2].classList.add('on');spot(e,6)}},
 {say:'Or by medical professionals, like your child’s doctor.',act:async()=>{const e=all('.b4-who')[3];e.classList.add('on');all('.b4-wires path')[3].classList.add('on');spot(e,6)}},
 {say:'Look at the top of that list. Parents. If you are worried about your child, you can start the process yourself. You do not have to wait for a teacher to bring it up.',li:2,act:async()=>{spot(all('.b4-who')[0],6)}}]},

{html:()=>HEAD('Put it in writing','A request that leaves a record')+`<div class="b4-letter">
 <div class="b4-row"><b>Date</b><span>October 21</span></div>
 <div class="b4-row"><b>To</b><span>The principal, my child’s school</span></div>
 <div class="b4-row"><b>Re</b><span>Request for a special education evaluation</span></div>
 <div class="b4-body"></div>
 <div class="b4-sign">Parent signature</div></div>
 <div class="b4-stamp">COPY KEPT<small>with the date</small></div>`+PTS([
 'Parents are encouraged to submit requests <b>in writing</b>.',
 'Writing <b>documents</b> exactly what you asked for.',
 'It also gives a clear starting point for <b>timelines</b>.',
 'Keep a copy, with the date you sent it.'],170),
 steps:[
 {say:'If you decide to ask for an evaluation, here is the most useful habit you can build. Parents are encouraged to submit requests in writing.',li:0,act:async()=>{spot(q('.b4-letter'),6)}},
 {say:'A short letter or email is enough. Say what you are asking for, and why you are concerned.',li:1,act:async()=>{spot(null);await type(q('.b4-body'),'I am writing to request a full evaluation of my child for special education. I am concerned about reading and attention at school.',28)}},
 {say:'Writing it down establishes documentation. There is a record of what you asked, and when you asked it. And it gives a clear starting point for timelines.',li:2,act:async()=>{spot(q('.b4-row'),4)}},
 {say:'Keep a copy for yourself, with the date you sent it. A conversation in the parking lot is easy to forget. A dated letter is not.',li:3,act:async()=>{spot(null);q('.b4-stamp').classList.add('on')}}]},

{html:()=>HEAD('A fair evaluation','What the rules require')+`<div class="b4-clip"><h4>Evaluation checklist · 34 C.F.R. §300.304</h4>
 <div class="b4-chk"><div class="b4-box">${B4_TICK}</div><div>A variety of assessment tools<small>Not one test or one score</small></div></div>
 <div class="b4-chk"><div class="b4-box">${B4_TICK}</div><div>All suspected areas of disability<small>Every concern gets looked at</small></div></div>
 <div class="b4-chk"><div class="b4-box">${B4_TICK}</div><div>No discriminatory testing<small>Fair to your child’s language and culture</small></div></div>
 <div class="b4-chk"><div class="b4-box">${B4_TICK}</div><div>Qualified personnel<small>Done by people trained to do it</small></div></div>
 <div class="b4-tools"><span class="chip">Tests</span><span class="chip">Observations</span><span class="chip">Work samples</span><span class="chip coral">What you share</span></div></div>`+PTS([
 'Federal rule: <b>34 C.F.R. §300.304</b>.',
 'Use a <b>variety</b> of assessment tools.',
 'Assess <b>all</b> suspected areas of disability.',
 '<b>Avoid discriminatory</b> testing.',
 'Use <b>qualified personnel</b>.'],160),
 steps:[
 {say:'Once an evaluation happens, it has to meet a standard. That standard is in [34 C.F.R. §300.304|thirty four C F R, section three hundred point three oh four]. Four requirements.',li:0,act:async()=>{spot(q('.b4-clip h4'),6)}},
 {say:'One. Schools must use a variety of assessment tools. Not one test, and not one score.',li:1,act:async()=>{all('.b4-box')[0].classList.add('on');spot(all('.b4-chk')[0],4);await wait(800);q('.b4-tools').classList.add('on')}},
 {say:'Two. They must assess all suspected areas of disability. If you are worried about reading and about attention, both get looked at.',li:2,act:async()=>{all('.b4-box')[1].classList.add('on');spot(all('.b4-chk')[1],4)}},
 {say:'Three. They must avoid discriminatory testing. The testing has to be fair to your child, including your child’s language and culture.',li:3,act:async()=>{all('.b4-box')[2].classList.add('on');spot(all('.b4-chk')[2],4)}},
 {say:'Four. They must use qualified personnel. The people giving and scoring the tests must be trained to do it.',li:4,act:async()=>{all('.b4-box')[3].classList.add('on');spot(all('.b4-chk')[3],4)}},
 {say:'Comprehensive and nondiscriminatory. Those are the two words to remember about a good evaluation.',act:async()=>{spot(null)}}]},

{html:()=>HEAD('What an evaluation decides','Eligibility and needs')+`<div class="b4-eval">Evaluation<small>a full look at your child</small></div>
 <svg class="b4-fork" viewBox="0 0 460 70"><path class="b4-p" d="M230 0 C230 40 76 30 76 70"/><path class="b4-p" d="M230 0 C230 40 436 30 436 70"/></svg>
 <div class="b4-out" style="left:66px"><h3>Eligibility</h3><p>Does my child qualify for special education?</p></div>
 <div class="b4-out b4-need" style="left:426px"><h3>Needs</h3><p>What help does my child need to learn?</p></div>
 <div class="b4-cats"><div><b>13</b>disability categories listed in IDEA</div><div class="b4-hi"><b>14</b>in Hawaiʻi, which adds Developmental Delay</div></div>`+PTS([
 'Evaluations decide <b>eligibility</b>.',
 'They also show your child’s <b>needs</b>.',
 'IDEA lists <b>13</b> disability categories. Hawaiʻi lists <b>14</b>, adding <b>Developmental Delay</b>.'],170),
 steps:[
 {say:'Why does all this care matter? Because an evaluation answers two big questions.',act:async()=>{spot(q('.b4-eval'),6);all('.b4-fork path').forEach(p=>p.classList.add('on'))}},
 {say:'First, eligibility. Does your child qualify for special education?',li:0,act:()=>b4on('.b4-out',0)},
 {say:'Second, needs. What exactly does your child need help with? A good evaluation shapes the services that follow.',li:1,act:()=>b4on('.b4-out',1)},
 {say:'Eligibility is decided using disability categories. The federal law, I D E A, lists thirteen. Hawaiʻi lists fourteen, because it adds one more: Developmental Delay.',li:2,act:async()=>{const c=q('.b4-cats');c.classList.add('on');spot(c,6)}}]},

{html:()=>HEAD('Reevaluations','At least once every three years')+`<div class="b4-time">
 <div class="b4-track"><i class="b4-fill"></i></div>
 <div class="b4-yr" style="left:40px"><b>0</b><span>First evaluation</span></div>
 <div class="b4-yr" style="left:240px"><b>1</b><span>Year 1</span></div>
 <div class="b4-yr" style="left:440px"><b>2</b><span>Year 2</span></div>
 <div class="b4-yr b4-y3" style="left:640px"><b>3</b><span>Reevaluation</span></div>
 <div class="b4-flag">At least once every three years</div></div>
 <div class="b4-why"><div class="b4-wy"><i>1</i>Continued eligibility</div><div class="b4-wy"><i>2</i>Review progress</div><div class="b4-wy"><i>3</i>Decide on services</div></div>`+PTS([
 'IDEA requires a <b>reevaluation</b> at least <b>once every three years</b>.',
 'It checks <b>continued eligibility</b>.',
 'It <b>reviews progress</b>.',
 'It helps decide <b>appropriate services</b>.'],170),
 steps:[
 {say:'Evaluation is not a one-time thing either. Children grow and change, and so do their needs.',act:async()=>{const y=all('.b4-yr');y[0].classList.add('on');q('.b4-fill').classList.add('on');for(let i=1;i<4;i++){await wait(450);y[i].classList.add('on')}}},
 {say:'I D E A requires a reevaluation at least once every three years.',li:0,act:async()=>{const f=q('.b4-flag');f.classList.add('on');spot(q('.b4-y3'),8)}},
 {say:'A reevaluation does three jobs. It decides whether your child is still eligible.',li:1,act:()=>b4on('.b4-why div',0)},
 {say:'It reviews the progress your child has made.',li:2,act:()=>b4on('.b4-why div',1)},
 {say:'And it helps decide what services are appropriate now.',li:3,act:async()=>{await b4on('.b4-why div',2);await wait(1200);spot(null)}}]},

{html:()=>HEAD('Your rights','If you disagree with the results')+`<div class="b4-rep" style="left:80px;top:160px"><h4>School evaluation</h4><div class="b4-by">By school staff</div><div class="ln"></div><div class="ln" style="width:75%"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:60%"></div></div>
 <svg class="b4-arw" viewBox="0 0 80 40"><path d="M4 20h64M54 8l14 12-14 12" fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <div class="b4-rep b4-iee" style="left:466px;top:160px"><h4>Independent Educational Evaluation</h4><div class="b4-by">By a qualified examiner who does not work for the school</div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:70%"></div></div>
 <div class="b4-bub">“I don’t agree with these results.”</div>`+PTS([
 'Parents have <b>rights</b> during the evaluation process.',
 'If you <b>disagree</b> with the school’s results, you can request an <b>Independent Educational Evaluation (IEE)</b>.',
 'Independent means a <b>qualified examiner who is not employed by the school</b>.'],170),
 steps:[
 {say:'Last, your rights. Parents have rights during the evaluation process. Here is one every parent should know.',li:0,act:async()=>{spot(q('.b4-rep'),6)}},
 {say:'Say the school’s evaluation comes back, and you read it, and it does not match the child you know.',act:async()=>{spot(null);q('.b4-bub').classList.add('on')}},
 {say:'You have the right to request an Independent Educational Evaluation, an I E E, if you disagree with the school’s assessment results.',li:1,act:async()=>{q('.b4-arw').classList.add('on');const e=q('.b4-iee');e.classList.add('on');await wait(300);spot(e,6)}},
 {say:'Independent means the evaluation is done by a qualified examiner who is not employed by the school. A second, outside look at your child.',li:2,act:async()=>{spot(q('.b4-iee .b4-by'),6)}},
 {say:'Disagreeing is not being difficult. It is one of the rights the law gives you.',act:async()=>{spot(null)}}]},

QUIZ([
 {q:'Under Child Find, what must school districts do?',o:['Wait until a parent asks for help','Evaluate only children who are failing classes','Identify, locate, and evaluate children who may have disabilities'],a:2,y:'Child Find is the ongoing duty to identify, locate, and evaluate.',n:'Think about the three cards with the ongoing arrow.'},
 {q:'Why are parents encouraged to put a referral request in writing?',o:['It documents the request and sets a starting point for timelines','A written request is the only kind a teacher can make','It lets the school skip the evaluation'],a:0,y:'Writing creates documentation and a clear start for timelines.',n:'Think about the dated letter and the copy you keep.'},
 {q:'You disagree with the school’s evaluation results. What can you request?',o:['A different classroom teacher','An Independent Educational Evaluation (IEE)','A reevaluation in five years'],a:1,y:'You have the right to request an IEE if you disagree.',n:'Think about the second report, from outside the school.'}]),

RECAP([
 '<b>Child Find</b>: schools must identify, locate and evaluate children who may have disabilities.',
 'Parents, teachers, administrators or doctors can refer. Put requests <b>in writing</b>.',
 'Evaluations must be <b>comprehensive and nondiscriminatory</b>.',
 'Evaluations decide <b>eligibility</b> and show your child’s <b>needs</b>.',
 'Reevaluation at least <b>once every three years</b>.',
 'Disagree with the results? You can request an <b>IEE</b>.'],[
 'Child Find means school districts have an ongoing duty to identify, locate, and evaluate children who may have disabilities.',
 'Parents, teachers, administrators, and medical professionals can all refer. When you do, put it in writing.',
 'Evaluations must be comprehensive and nondiscriminatory: a variety of tools, all suspected areas, fair testing, and qualified people.',
 'An evaluation decides eligibility, and shows what your child needs.',
 'Reevaluations happen at least once every three years.',
 'And if you disagree with the school’s results, you can request an Independent Educational Evaluation.']),

CLOSE({...L,sub:'That completes the Bronze lessons. The Bronze final quiz follows on the lesson page. Select Complete when you are ready.',
 say:'Mahalo! That is Lesson 4, and the end of the Bronze lessons. You now know how special education begins: with finding the child, and with a fair, complete evaluation. The Bronze final quiz follows on the lesson page. Select Complete on the lesson page when you are ready to take it.'})
];
</script>
