<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Lesson 4: Building Advocacy Networks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck-base.css">
<link rel="stylesheet" href="lesson-theme.css?v=1">
<style>
/* g4- = this deck only */
.g4-box{position:absolute;box-sizing:border-box;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);padding:16px 18px}
.g4-in{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.g4-in.on{opacity:1;transform:none}
.g4-t{font-family:"Outfit",sans-serif;font-weight:800;font-size:21px;color:var(--teal);margin:0 0 6px}
.g4-s{font-size:16px;color:var(--soft);font-weight:600;line-height:1.3}
.g4-ic{width:46px;height:46px;border-radius:12px;background:#ECFEFF;display:flex;align-items:center;justify-content:center;flex:none}
.g4-ic.c{background:#FFF7ED}

/* scene 2: one vs many */
.g4-dot{opacity:0;transition:opacity .4s}
.g4-dot.on{opacity:1}
.g4-ln{stroke-dasharray:520;stroke-dashoffset:520;transition:stroke-dashoffset 1.1s ease}
.g4-ln.on{stroke-dashoffset:0}
.g4-zero{position:absolute;left:70px;top:612px;width:690px;text-align:center;background:#FFF7ED;border:2px solid #FDBA74;border-radius:14px;padding:12px 16px;font-size:20px;font-weight:800;color:#9A3412}

/* scene 3: community map */
.g4-map{position:absolute;left:58px;top:130px;width:712px;height:550px}
.g4-map svg.g4-lines{position:absolute;left:0;top:0}
.g4-node{position:absolute;width:172px;box-sizing:border-box;background:#fff;border:2px solid #A5F3FC;border-radius:14px;padding:8px 10px;text-align:center;font-size:14.5px;font-weight:700;line-height:1.2;color:var(--ink);box-shadow:0 8px 18px rgba(15,23,42,.08);opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .45s,transform .45s cubic-bezier(.3,1.3,.5,1)}
.g4-node.on{opacity:1;transform:translate(-50%,-50%)}
.g4-node svg{display:block;margin:0 auto 4px}
.g4-node.hub{width:186px;border-color:var(--coral);background:#FFF7ED;font-size:16px}

/* scene 4: start small */
.g4-month{position:absolute;top:150px;width:205px;box-sizing:border-box;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px 16px;box-shadow:0 10px 24px rgba(15,23,42,.07)}
.g4-month h4{margin:0 0 8px;font-family:"Outfit",sans-serif;font-size:18px;color:var(--teal)}
.g4-grid{display:grid;grid-template-columns:repeat(7,20px);gap:4px}
.g4-grid i{width:20px;height:20px;border-radius:5px;background:#F1F5F9}
.g4-grid i.g4-pick{background:#F1F5F9;transition:background .4s,box-shadow .4s}
.g4-grid i.g4-pick.on{background:var(--coral);box-shadow:0 0 0 4px #FED7AA}
.g4-fam{display:flex;gap:14px;justify-content:center;margin:12px 0 10px}
.g4-crowd{display:grid;grid-template-columns:repeat(7,26px);gap:8px;justify-content:center;margin:12px 0 10px}
.g4-crowd i{width:26px;height:26px;border-radius:50%;background:#CBD5E1}
.g4-tag{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}

/* scene 5: permission */
.g4-fcard{position:absolute;top:150px;width:250px;height:196px}
.g4-ck{width:32px;height:32px;border-radius:8px;border:3px solid #CBD5E1;display:flex;align-items:center;justify-content:center;transition:all .35s;flex:none}
.g4-ck svg{opacity:0;transition:opacity .3s}
.g4-ck.on{background:#16A34A;border-color:#16A34A}
.g4-ck.on svg{opacity:1}
.g4-ok{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:17px;font-weight:700;color:#334155}
.g4-link{position:absolute;left:320px;top:190px}
.g4-intro{position:absolute;left:340px;top:250px;width:150px;text-align:center}
.g4-chat{position:absolute;left:70px;top:372px;width:690px;height:292px;background:#F8FAFC}
.g4-msg{max-width:430px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 14px;font-size:16.5px;color:#334155;margin:10px 0;box-shadow:0 4px 10px rgba(15,23,42,.05)}
.g4-msg.bad{position:relative;border-color:#FCA5A5;background:#FEF2F2;color:#991B1B;text-decoration:line-through;text-decoration-color:#DC2626}
.g4-stamp{position:absolute;left:462px;top:112px;transform:rotate(-6deg) scale(.7);opacity:0;transition:all .4s cubic-bezier(.3,1.3,.5,1);border:3px solid #DC2626;color:#DC2626;border-radius:10px;padding:6px 14px;font-family:"Outfit",sans-serif;font-weight:800;font-size:18px;background:#fff;text-transform:uppercase;letter-spacing:.04em}
.g4-stamp.on{opacity:1;transform:rotate(-6deg)}

/* scene 6: easy to join */
.g4-way{position:absolute;top:160px;width:210px;height:170px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.g4-way .g4-ic{width:70px;height:70px;border-radius:20px}
.g4-way b{font-family:"Outfit",sans-serif;font-size:22px;color:var(--ink)}
.g4-think{position:absolute;left:70px;top:356px;font-size:15px;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:.08em}
.g4-need{position:absolute;width:335px;height:96px;display:flex;align-items:center;gap:14px;font-size:19px;font-weight:700}

/* scene 7: shared leadership */
.g4-tire{transition:filter .6s,opacity .6s}
.g4-tire.on{filter:grayscale(1);opacity:.4}
.g4-role{display:flex;align-items:center;gap:14px;margin:16px 0;padding:12px 14px;border-radius:14px;background:#F8FAFC;border:2px solid var(--line)}
.g4-role.on{border-color:#A5F3FC;background:#ECFEFF}
.g4-av{width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:20px;color:#fff}
.g4-role b{font-size:19px}

/* scene 8: partners */
.g4-pc{position:absolute;top:150px;width:160px;height:124px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;line-height:1.15}
.g4-give{position:absolute;top:300px;width:210px;height:62px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;padding:10px 14px}
.g4-ask{position:absolute;left:70px;top:390px;width:690px;height:118px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g4-ask h5{margin:0 0 6px;font-family:"Outfit",sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.g4-ask p{margin:0;font-size:18px;color:#334155;line-height:1.35}
.g4-ldah{position:absolute;left:70px;top:530px;width:690px;height:84px;display:flex;align-items:center;gap:16px;background:#FFF7ED;border-color:#FDBA74;font-size:19px;font-weight:700;color:#9A3412}

/* scene 9: keeping it going */
.g4-rec table{width:100%;border-collapse:collapse;font-size:15px}
.g4-rec th{text-align:left;color:var(--soft);font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-bottom:2px solid var(--line)}
.g4-rec td{padding:8px 6px;border-bottom:1px solid #F1F5F9;color:#334155}
.g4-row{opacity:0;transition:opacity .4s}
.g4-row.on{opacity:1}
.g4-mini{position:absolute;left:430px;width:330px;height:105px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700}
.g4-relay{position:absolute;left:70px;top:410px;width:690px;height:240px}
.g4-baton{position:absolute;left:186px;top:122px;transition:transform 1.6s cubic-bezier(.5,0,.3,1)}
.g4-baton.on{transform:translateX(312px)}
.g4-who{position:absolute;top:196px;width:150px;text-align:center;font-weight:800;font-size:17px}

/* scene 10: the measure */
.g4-bar{height:12px;border-radius:6px;background:#E2E8F0;margin:13px 0}
.g4-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px}
.g4-did{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:#334155;margin:10px 0}
</style>
</head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="lesson-kit.js?v=1"></script>
<script>
const DECK_ID='cert-gold-4';
const L={tier:'gold',lesson:'Gold Lesson 4',title:'Building Advocacy Networks'};

/* inline icons (no images, no emoji) */
const G4I=(d,c='#0E7490',s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const G4P={
 school:'<path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
 people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M15 14.5c3 0 6 2 6 5.5"/>',
 church:'<path d="M12 2v5M10 4h4"/><path d="M6 21V11l6-4 6 4v10"/><path d="M10 21v-4h4v4"/>',
 flower:'<circle cx="12" cy="12" r="2.5"/><path d="M12 9.5C12 5 15 3 15 3s1 4-3 6.5M12 14.5c0 4.5-3 6.5-3 6.5s-1-4 3-6.5M9.5 12C5 12 3 9 3 9s4-1 6.5 3M14.5 12c4.5 0 6.5 3 6.5 3s-4 1-6.5-3"/>',
 health:'<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/><path d="M12 10v5M9.5 12.5h5"/>',
 book:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 heart:'<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>',
 family:'<circle cx="8" cy="7" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="12" cy="15" r="2.2"/><path d="M2 21c0-3.5 2.7-6 6-6M22 21c0-3.5-2.7-6-6-6M8.5 21c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/>',
 phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
 laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 shop:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5 13v8h14v-8"/>',
 door:'<path d="M5 21V4h11v17M3 21h18"/><path d="M13 12h.01"/>',
 flyer:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 lang:'<path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-4 7-7 8"/><path d="M13 21l4-9 4 9M14.5 18h5"/>',
 child:'<circle cx="12" cy="6" r="3"/><path d="M7 21v-6a5 5 0 0 1 10 0v6"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><path d="M7 18v3M17 18v3"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/>'};
const IC=(k,c,s)=>G4I(G4P[k],c,s);
const ICB=(k,cls='')=>`<div class="g4-ic ${cls}">${IC(k,cls?'#C2410C':'#0E7490',26)}</div>`;

/* scene 2: one advocate vs a network */
const NET=[[40,40],[135,28],[232,48],[300,112],[62,132],[162,118],[252,178],[32,228],[122,214],[212,258],[300,252],[86,292]];
const NETL=[[0,1],[1,2],[2,3],[0,4],[1,5],[4,5],[5,2],[5,6],[3,6],[4,7],[4,8],[5,8],[8,9],[6,9],[6,10],[9,10],[7,8],[8,11],[7,11],[9,11]];
const ONEMANY=()=>`<div class="g4-box g4-in g4-one" style="left:70px;top:150px;width:290px;height:440px">
 <div class="g4-t">One advocate</div><div class="g4-s">One family at a time</div>
 <svg viewBox="0 0 250 320" width="250" height="320" style="margin-top:6px">
  <line x1="125" y1="80" x2="125" y2="240" stroke="#FDBA74" stroke-width="4"/>
  <circle cx="125" cy="70" r="34" fill="#F97316"/><g transform="translate(107 52)">${G4I(G4P.people,'#fff',36)}</g>
  <circle cx="125" cy="250" r="30" fill="#0E7490"/><g transform="translate(109 234)">${G4I(G4P.family,'#fff',32)}</g>
 </svg></div>
 <div class="g4-box g4-in g4-many" style="left:384px;top:150px;width:376px;height:440px">
 <div class="g4-t">A network</div><div class="g4-s">Families connected to each other and to the groups around them</div>
 <svg viewBox="0 0 340 320" width="336" height="316" style="margin-top:4px">
  ${NETL.map(([a,b])=>`<line class="g4-ln" x1="${NET[a][0]}" y1="${NET[a][1]}" x2="${NET[b][0]}" y2="${NET[b][1]}" stroke="#67E8F9" stroke-width="3"/>`).join('')}
  ${NET.map(([x,y],i)=>`<circle class="g4-dot" cx="${x}" cy="${y}" r="${i===5?20:14}" fill="${i===5?'#F97316':'#0E7490'}" stroke="#fff" stroke-width="3"/>`).join('')}
 </svg></div>
 <div class="g4-zero g4-in">No family has to start from zero.</div>`;

/* scene 3: community map */
const MAPN=[
 ['LDAH workshops &amp; support',356,275,'people'],
 ['School parent groups &amp; School Community Councils',356,78,'school'],
 ['Community Children’s Councils',572,150,'people'],
 ['Churches',619,322,'church'],
 ['Cultural associations',480,462,'flower'],
 ['Health centers',232,462,'health'],
 ['Libraries',93,322,'book'],
 ['Youth programs',140,150,'star']];
const MAPL=(()=>{const h=MAPN[0],l=[];for(let i=1;i<8;i++){l.push([h[1],h[2],MAPN[i][1],MAPN[i][2]]);const j=i===7?1:i+1;l.push([MAPN[i][1],MAPN[i][2],MAPN[j][1],MAPN[j][2]])}return l})();
const MAP=()=>`<div class="g4-map"><svg class="g4-lines" viewBox="0 0 712 550" width="712" height="550">${MAPL.map((p,i)=>`<line class="g4-ln" x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" stroke="${i%2?'#FDBA74':'#67E8F9'}" stroke-width="4" stroke-linecap="round"/>`).join('')}</svg>
 ${MAPN.map((n,i)=>`<div class="g4-node${i?'':' hub'}" style="left:${n[1]}px;top:${n[2]}px">${IC(n[3],i?'#0E7490':'#C2410C',26)}${n[0]}</div>`).join('')}</div>`;
const nodes=async(a)=>{const ns=all('.g4-node');for(const i of a){ns[i].classList.add('on');await wait(220)}};

/* scene 4: start small */
const MONTH=(n,x)=>`<div class="g4-month g4-in" style="left:${x}px"><h4>Month ${n}</h4><div class="g4-grid">${Array.from({length:28},(_,i)=>`<i${i===9?' class="g4-pick"':''}></i>`).join('')}</div></div>`;

/* scene 7 helper */
const ROLE=(l,c,t)=>`<div class="g4-role g4-in"><div class="g4-av" style="background:${c}">${l}</div><b>${t}</b></div>`;

const SC=[
COVER({...L,title:'Building Advocacy Networks',
 sub:'Connecting families to each other and to the organizations around them, so no family has to start from zero.',
 say:'Aloha, and welcome to Gold Lesson 4, Building Advocacy Networks. This is the final lesson of the L D A H Certification Program. You have learned to advocate for your own child. Now we look at how families, connected together, can do far more than any one of us can alone.'}),

{html:()=>HEAD('Why networks','One advocate, or many')+ONEMANY()+PTS([
 'One advocate helps <b>one family</b> at a time.',
 'A network can help <b>hundreds</b>.',
 'Connect families to <b>each other</b> and to the <b>organizations</b> around them.'],170),
 steps:[
 {say:'One advocate can help one family at a time. That is real and important work. You may already be doing it.',li:0,act:async()=>{const c=q('.g4-one');c.classList.add('on');spot(c,6)}},
 {say:'A network can help hundreds. When families are connected, help travels further than any one person can carry it.',li:1,act:async()=>{spot(null);q('.g4-many').classList.add('on');await reveal('.g4-dot');for(const l of all('.g4-ln')){l.classList.add('on');await wait(70)}}},
 {say:'This final Gold lesson is about connecting families to each other, and to the organizations around them, so no family has to start from zero.',li:2,act:async()=>{const z=q('.g4-zero');z.classList.add('on');spot(z,6)}}]},

{html:()=>HEAD('Map what already exists','Your community map')+MAP()+PTS([
 'Before building anything new, <b>list what is already there</b>.',
 'LDAH workshops and support. School parent groups and School Community Councils. Community Children’s Councils.',
 'Churches, cultural associations, health centers, libraries and youth programs.',
 'Most networks grow by <b>connecting</b> these, not by replacing them.'],150),
 steps:[
 {say:'Before you build anything new, make a map. List what is already in your community.',li:0},
 {say:'Start with L D A H workshops and support.',act:async()=>{await nodes([0]);spot(all('.g4-node')[0],6)}},
 {say:'Then the schools. School level parent groups, and School Community Councils. And the Community Children’s Councils.',li:1,act:async()=>{spot(null);await nodes([1,2])}},
 {say:'Now look wider. Churches. Cultural associations. Health centers. Libraries. Youth programs. Families already gather in all of these places.',li:2,act:()=>nodes([3,4,5,6,7])},
 {say:'Here is the key. Most networks grow by connecting these groups, not by replacing them. You are not starting from nothing. You are drawing the lines between what is already there.',li:3,act:async()=>{for(const l of all('.g4-ln')){l.classList.add('on');await wait(90)}}}]},

{html:()=>HEAD('Building the network','1. Start small')+MONTH(1,70)+MONTH(2,293)+MONTH(3,516)+`
 <div class="g4-box g4-in g4-three" style="left:70px;top:378px;width:330px;height:196px;border-color:#86EFAC">
  <div class="g4-t">Three families</div><div class="g4-fam">${[0,1,2].map(()=>`<div class="g4-ic" style="width:64px;height:64px;border-radius:50%">${IC('family','#0E7490',38)}</div>`).join('')}</div>
  <div class="g4-tag" style="color:#15803D"><span class="g4-ck on" style="width:28px;height:28px">${IC('check','#fff',18)}</span>Meet every month</div></div>
 <div class="g4-box g4-in g4-crowdbox" style="left:430px;top:378px;width:330px;height:196px;background:#F8FAFC;filter:grayscale(1)">
  <div class="g4-t" style="color:#64748B">A large group</div><div class="g4-crowd">${Array.from({length:14},()=>'<i></i>').join('')}</div>
  <div class="g4-tag" style="color:#64748B"><span class="g4-ic" style="width:28px;height:28px;border-radius:8px;background:#E2E8F0">${IC('x','#64748B',18)}</span>Never meets</div></div>`+PTS([
 'Three families who meet <b>monthly</b> can do more than a large group that never meets.',
 'Pick a <b>regular time and place</b>.',
 '<b>Keep it going.</b>'],170),
 steps:[
 {say:'Building the network. Step one: start small. Three families who meet monthly can do more than a large group that never meets.',li:0,act:async()=>{q('.g4-crowdbox').classList.add('on');await wait(500);const t=q('.g4-three');t.classList.add('on');spot(t,6)}},
 {say:'Pick a regular time and place. The same day, the same room, every month. Families can plan around it.',li:1,act:async()=>{spot(null);for(const m of all('.g4-month')){m.classList.add('on');await wait(300)}}},
 {say:'And keep it going. Each month the circled day comes around again, and the same families show up for each other.',li:2,act:async()=>{for(const p of all('.g4-pick')){p.classList.add('on');await wait(450)}}}]},

{html:()=>HEAD('Building the network','2. Connect with permission')+
 ['A','B'].map((f,i)=>`<div class="g4-box g4-in g4-fcard" style="left:${i?510:70}px"><div style="display:flex;gap:12px;align-items:center">${ICB('family')}<div class="g4-t" style="margin:0">Family ${f}</div></div>
  <div class="g4-ok"><span class="g4-ck g4-ck${i}">${IC('check','#fff',20)}</span>Agrees to be introduced</div>
  <div class="g4-ok"><span class="g4-ck g4-cd${i}">${IC('check','#fff',20)}</span>OK to share contact details</div></div>`).join('')+`
 <svg class="g4-link" width="190" height="60" viewBox="0 0 190 60"><line class="g4-ln g4-join" x1="0" y1="30" x2="190" y2="30" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/></svg>
 <div class="g4-intro g4-in"><span class="chip" style="font-size:15px">Introduction</span></div>
 <div class="g4-box g4-in g4-chat"><div style="display:flex;gap:10px;align-items:center;font-weight:800;color:var(--teal);font-size:17px">${IC('chat','#0E7490',22)}Parent group chat</div>
  <div class="g4-msg">Next meeting is at the library, same time as always. Who can come?</div>
  <div class="g4-msg bad">Family A’s son just got a new diagnosis, and here is their phone number...</div>
  <div class="g4-msg">If you would like to meet another family, message me and I will ask them first.</div>
  <div class="g4-stamp">${IC('lock','#DC2626',18)} Keep it private</div></div>`+PTS([
 'Introduce families only when <b>both have agreed</b>.',
 'Share contact details <b>only with consent</b>.',
 'Keep private details <b>out of group chats</b> and social media posts.'],170),
 steps:[
 {say:'Step two: connect with permission. Here are two families who might really help each other.',act:async()=>{await reveal('.g4-fcard')}},
 {say:'Introduce families to each other only when both have agreed. Ask the first family. Yes.',li:0,act:async()=>{const c=q('.g4-ck0');c.classList.add('on');spot(c,8)}},
 {say:'Ask the second family. Yes. Now, and only now, make the introduction.',act:async()=>{const c=q('.g4-ck1');c.classList.add('on');spot(c,8);await wait(700);spot(null);q('.g4-join').classList.add('on');await wait(600);q('.g4-intro').classList.add('on')}},
 {say:'The same goes for contact details. Share a phone number or an email only with consent. It belongs to the family, not to the group.',li:1,act:async()=>{q('.g4-cd0').classList.add('on');await wait(400);q('.g4-cd1').classList.add('on')}},
 {say:'And keep private details out of group chats and social media posts. A child’s diagnosis, a phone number, a hard week at home: those are not for the group to share.',li:2,act:async()=>{q('.g4-chat').classList.add('on');await wait(700);const m=all('.g4-msg.bad')[0];spot(m,6);await wait(600);q('.g4-stamp').classList.add('on')}}]},

{html:()=>HEAD('Building the network','3. Make it easy to join')+
 [['people','In person'],['laptop','Online'],['phone','By phone']].map((w,i)=>`<div class="g4-box g4-in g4-way" style="left:${70+i*230}px"><div class="g4-ic">${IC(w[0],'#0E7490',40)}</div><b>${w[1]}</b></div>`).join('')+
 `<div class="g4-think g4-in">Think about</div>`+
 [['lang','Language'],['child','Childcare'],['bus','Transportation'],['clock','Timing for working parents']].map((n,i)=>`<div class="g4-box g4-in g4-need" style="left:${70+(i%2)*355}px;top:${388+Math.floor(i/2)*116}px">${ICB(n[0],'c')}${n[1]}</div>`).join('')+PTS([
 'Offer <b>more than one way</b> to take part.',
 'In person, online, by phone.',
 'Think about <b>language</b>, <b>childcare</b>, <b>transportation</b> and <b>timing</b> for working parents.'],170),
 steps:[
 {say:'Step three: make it easy to join. Offer more than one way to take part.',li:0},
 {say:'In person. Online. By phone. A parent who cannot leave the house on a Tuesday night may still be able to call in.',li:1,act:()=>reveal('.g4-way')},
 {say:'Then think about what keeps families away. Language. Can a parent take part in the language they are most comfortable in? Childcare, so parents can actually come.',li:2,act:async()=>{q('.g4-think').classList.add('on');const n=all('.g4-need');n[0].classList.add('on');await wait(500);n[1].classList.add('on')}},
 {say:'Transportation. And timing for working parents. A meeting at two in the afternoon leaves out many of the families who need it most.',act:async()=>{const n=all('.g4-need');n[2].classList.add('on');await wait(500);n[3].classList.add('on')}}]},

{html:()=>HEAD('Building the network','4. Share leadership')+`
 <div class="g4-box g4-in g4-solo" style="left:70px;top:150px;width:320px;height:420px">
  <div class="g4-t">One person does it all</div>
  <svg class="g4-tire" viewBox="0 0 280 290" width="280" height="290">
   ${[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4,x=140+105*Math.cos(a),y=145+105*Math.sin(a);return `<line x1="140" y1="145" x2="${x}" y2="${y}" stroke="#FDBA74" stroke-width="3"/><circle cx="${x}" cy="${y}" r="16" fill="#0E7490"/>`}).join('')}
   <circle cx="140" cy="145" r="34" fill="#F97316"/><g transform="translate(120 125)">${G4I(G4P.people,'#fff',40)}</g></svg>
  <div class="g4-in g4-tiredtxt" style="margin-top:12px;font-size:18px;font-weight:800;color:#B91C1C">Ends when that person is tired</div></div>
 <div class="g4-box g4-in g4-shared" style="left:410px;top:150px;width:350px;height:420px;border-color:#A5F3FC">
  <div class="g4-t">Leadership is shared</div>
  ${ROLE('K','#0E7490','Hosts the meeting')}${ROLE('M','#F97316','Shares a story')}${ROLE('L','#7C3AED','Brings a speaker')}
  <div class="g4-s" style="margin-top:6px">More hands, so the work never rests on one person.</div></div>`+PTS([
 'A network that depends on one person <b>ends when that person is tired</b>.',
 'Invite others to <b>host</b>, <b>share a story</b>, or <b>bring a speaker</b>.',
 'Shared leadership is what <b>keeps a network going</b>.'],170),
 steps:[
 {say:'Step four: share leadership. Here is a network that runs through one person. Every call, every room, every reminder goes through them.',act:async()=>{const s=q('.g4-solo');s.classList.add('on');spot(s,6)}},
 {say:'It works, for a while. But a network that depends on one person ends when that person is tired.',li:0,act:async()=>{spot(null);q('.g4-tire').classList.add('on');await wait(500);q('.g4-tiredtxt').classList.add('on')}},
 {say:'So invite others in. Ask one parent to host a meeting.',li:1,act:async()=>{q('.g4-shared').classList.add('on');await wait(300);const r=all('.g4-role')[0];r.classList.add('on');spot(r,4)}},
 {say:'Ask another to share their story. Ask someone else to bring a speaker.',act:async()=>{const r=all('.g4-role');r[1].classList.add('on');spot(r[1],4);await wait(1300);r[2].classList.add('on');spot(r[2],4)}},
 {say:'Sharing leadership is what keeps a network going. When many people hold a piece of it, it does not stop when one of them needs a rest.',li:2,act:async()=>{spot(null)}}]},

{html:()=>HEAD('Partners beyond families','Who else can help')+
 [['school','Schools'],['health','Health providers'],['flower','Cultural organizations'],['shop','Businesses']].map((p,i)=>`<div class="g4-box g4-in g4-pc" style="left:${70+i*177}px">${ICB(p[0])}${p[1]}</div>`).join('')+
 [['door','A meeting room'],['flyer','A flyer on a notice board'],['mic','A speaker']].map((g,i)=>`<div class="g4-box g4-in g4-give" style="left:${70+i*240}px">${IC(g[0],'#C2410C',26)}<span>${g[1]}</span></div>`).join('')+`
 <div class="g4-box g4-in g4-ask"><div><h5 style="color:var(--teal)">What we are asking for</h5><p>The library meeting room, one evening a month.</p></div>
  <div><h5 style="color:#15803D">What families gain</h5><p>A free, welcoming place to meet, close to home.</p></div></div>
 <div class="g4-box g4-in g4-ldah">${ICB('people','c')}Want a workshop or training on a specific topic? Bring LDAH in.</div>`+PTS([
 'Schools, health providers, cultural organizations and businesses <b>can all help</b>.',
 'A meeting room, a flyer on a notice board, a speaker.',
 'Be clear about <b>what you are asking for</b> and <b>what families gain</b>.',
 'Bring <b>LDAH</b> in when a group wants a workshop or training on a specific topic.'],150),
 steps:[
 {say:'Your network is not only families. Schools, health providers, cultural organizations and businesses can all help.',li:0,act:()=>reveal('.g4-pc')},
 {say:'Often the help is simple. A meeting room. A flyer on a notice board. A speaker.',li:1,act:()=>reveal('.g4-give')},
 {say:'When you ask, be clear. Say exactly what you are asking for, and what the families gain. A clear ask is much easier to say yes to.',li:2,act:async()=>{const a=q('.g4-ask');a.classList.add('on');spot(a,6)}},
 {say:'And bring L D A H in when a group wants a workshop or training on a specific topic.',li:3,act:async()=>{const d=q('.g4-ldah');d.classList.add('on');spot(d,6);await wait(1500);spot(null)}}]},

{html:()=>HEAD('Keeping it going','So it lasts')+`
 <div class="g4-box g4-in g4-rec" style="left:70px;top:150px;width:340px;height:230px"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${IC('clip','#0E7490',24)}<span class="g4-t" style="margin:0">Group record</span></div>

  <tr class="g4-row"><td>2</td><td>4 families</td><td>A speaker</td></tr>
  <tr class="g4-row"><td>3</td><td>5 families</td><td>Childcare</td></tr></table></div>
 <div class="g4-box g4-in g4-mini g4-cele" style="top:150px">${ICB('star','c')}Celebrate wins, large and small</div>
 <div class="g4-box g4-in g4-mini g4-call" style="top:275px">${ICB('phone')}Check in with families who stop coming</div>

  <svg style="position:absolute;left:60px;top:70px" width="570" height="130" viewBox="0 0 570 130"><line x1="110" y1="80" x2="460" y2="80" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8"/>
   <g transform="translate(20 0)"><circle cx="45" cy="30" r="22" fill="#F97316"/><path d="M10 125c0-30 15-55 35-55s35 25 35 55z" fill="#F97316"/><path d="M75 92l35-10" stroke="#F97316" stroke-width="10" stroke-linecap="round"/></g>
   <g transform="translate(460 0)"><circle cx="45" cy="30" r="22" fill="#0E7490"/><path d="M10 125c0-30 15-55 35-55s35 25 35 55z" fill="#0E7490"/><path d="M15 92l-35-10" stroke="#0E7490" stroke-width="10" stroke-linecap="round"/></g></svg>
  <svg class="g4-baton" width="70" height="22" viewBox="0 0 70 22"><rect x="2" y="2" width="66" height="18" rx="9" fill="#D97706" stroke="#78350F" stroke-width="2"/><path d="M14 2v18M56 2v18" stroke="#FDE68A" stroke-width="3"/></svg>
  <div class="g4-who" style="left:45px;color:#C2410C">You</div><div class="g4-who" style="left:485px;color:#0E7490">The next leader</div></div>`+PTS([
 'Keep a <b>simple record</b> of who came and what the group asked for.',
 '<b>Celebrate wins</b>, large and small.',
 '<b>Check in</b> with families who stop coming.',
 '<b>Plan for the next leader</b>, so the network outlasts any one person, including you.'],150),
 steps:[
 {say:'Keeping it going. First, keep a simple record of who came, and what the group asked for. Nothing fancy. It shows you what families need next.',li:0,act:async()=>{q('.g4-rec').classList.add('on');await reveal('.g4-row')}},
 {say:'Celebrate wins, large and small. A service that finally started. A parent who spoke up for the first time.',li:1,act:async()=>{const c=q('.g4-cele');c.classList.add('on');spot(c,6)}},
 {say:'Check in with families who stop coming. A short call lets them know they are missed, and that the door is still open.',li:2,act:async()=>{const c=q('.g4-call');c.classList.add('on');spot(c,6)}},
 {say:'And plan for the next leader. Pass the baton on purpose, so the network outlasts any one person. Including you.',li:3,act:async()=>{spot(null);q('.g4-relay').classList.add('on');await wait(800);q('.g4-baton').classList.add('on')}}]},

{html:()=>HEAD('Remember','How to measure a network')+`

  <div class="g4-t" style="color:#64748B">Names on a list</div>${Array.from({length:12},(_,i)=>`<div class="g4-bar" style="width:${[90,70,82,64,88,76,60,84,72,90,66,80][i]}%"></div>`).join('')}
  <span class="g4-badge" style="background:#F1F5F9;color:#64748B;margin-top:6px">${IC('x','#64748B',18)} Not the measure</span></div>
 <div class="g4-box g4-in g4-can" style="left:410px;top:150px;width:350px;height:430px;border-color:#86EFAC">

  <div class="g4-did g4-in">${IC('check','#16A34A',24)}Speak up at their own meetings</div>

 'A network is measured by <b>what families can do for themselves and each other</b>.',

 steps:[
 {say:'One last thought for this lesson. It is easy to count the names on a list.',act:async()=>{q('.g4-list').classList.add('on')}},
 {say:'But a network is measured by what families can do for themselves and each other, not by how many people are on the list.',li:1,act:async()=>{const c=q('.g4-can');c.classList.add('on');await wait(300);await reveal('.g4-did');spot(c,6)}},
 {say:'Families who can find their way, speak up, welcome others, and lead when it is their turn. That is a network doing its job.',act:async()=>{spot(null)}}]},

QUIZ([
 {q:'You want to start a parent network in your area. What is the best first step?',o:['Start a brand-new group from scratch','Wait for the school to set one up','Map the groups and organizations already in your community'],a:2,y:'Most networks grow by connecting what already exists, not by replacing it.',n:'Think about the community map we drew.'},
 {q:'A parent asks you for another family’s phone number. What do you do?',o:['Share it only after that family has agreed','Post it in the group chat so everyone has it','Give it right away, since both families are in the network'],a:0,y:'Share contact details only with consent.',n:'Think about the checkmarks before the introduction.'},
