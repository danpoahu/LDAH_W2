<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lions Consent Forms Upload - LDAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!-- DOH upload for Lions screening consent forms (2026-11-20). The secret link key
     is checked by the lionsDohUpload Cloud Function (link only, no code, no expiry).
     Upload only: this page can never show or list anything. -->
<style>
:root{ --ocean:#0891B2; --deep:#1a3c6e; --ink:#1E293B; --soft:#64748B; --line:#E2E8F0; --bg:#FEFDFB; --ok:#15803D; --warn:#B45309; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; min-height:100vh; }
header{ background:#fff; border-bottom:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; gap:12px; }
header img{ height:44px; }
header span{ font-family:'Outfit',sans-serif; font-weight:600; color:var(--deep); }
main{ max-width:620px; margin:28px auto; padding:0 16px; }
h1{ font-family:'Outfit',sans-serif; font-size:1.5rem; color:var(--deep); margin-bottom:10px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 6px 24px rgba(2,60,100,.06); }
.child{ background:#FFFBEB; border:1.5px solid #F59E0B; border-left:5px solid #D97706; border-radius:10px; padding:12px 14px; margin:14px 0; color:#78350F; }
.child b{ color:#7C2D12; }
.drop{ border:2px dashed #94A3B8; border-radius:12px; padding:26px 14px; text-align:center; cursor:pointer; margin-top:14px; transition:.15s; }
.drop:hover,.drop.over{ border-color:var(--ocean); background:#F0F9FF; }
.drop strong{ display:block; font-size:1.05rem; color:var(--deep); }
.drop small{ color:var(--soft); }
.btn{ display:inline-block; margin-top:16px; background:var(--deep); color:#fff; border:0; border-radius:8px; padding:12px 26px; font-weight:700; font-size:1rem; cursor:pointer; font-family:inherit; }
.btn:disabled{ opacity:.5; cursor:default; }
#files{ margin-top:10px; font-size:.95rem; color:var(--soft); }
#msg{ margin-top:14px; font-weight:600; }
.ok{ color:var(--ok); } .err{ color:#B91C1C; }
.done{ text-align:center; padding:10px 0; }
.done h2{ font-family:'Outfit',sans-serif; color:var(--ok); margin-bottom:6px; }
input[type=text]{ width:100%; font:inherit; font-size:1.05rem; padding:10px 12px; border:1.5px solid #CBD5E1; border-radius:8px; margin-top:6px; }
#code{ letter-spacing:6px; font-size:1.4rem; max-width:220px; }
label{ font-weight:700; display:block; margin-top:14px; }
.note{ color:var(--soft); font-size:.92rem; margin-top:8px; }
.prog{ height:8px; background:#E2E8F0; border-radius:6px; overflow:hidden; margin-top:12px; display:none; }
.prog i{ display:block; height:100%; width:0; background:var(--ocean); transition:width .2s; }
.lock{ display:flex; gap:8px; align-items:center; color:var(--ok); font-weight:600; font-size:.92rem; margin-bottom:8px; }
</style>
</head>
<body>
<header><img src="logo_blue.png" alt="LDAH logo"><span>Leadership in Disabilities &amp; Achievement of Hawaiʻi</span></header>
<main>
  <div class="card" id="card">
    <div class="lock">&#128274; Secure upload to LDAH</div>
    <h1>Lions screening consent forms</h1>
    <p id="lead">Checking your link…</p>

    <div id="stepUpload" style="display:none;">
      <label for="school">School</label>
      <input type="text" id="school" placeholder="e.g. Waipahu Elementary" maxlength="120">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose files to upload">
        <strong>Click to choose the forms</strong>
        <small>or drag them here · PDF, JPG or PNG · PDFs up to 20 MB, photos up to 6 MB</small>
      </div>
      <input type="file" id="pick" accept="application/pdf,image/jpeg,image/png" multiple hidden>
      <div id="files"></div>
      <div class="prog" id="prog"><i></i></div>
      <button class="btn" id="send" disabled>Send to LDAH</button>
      <p class="note">This page only sends. Once sent, forms can't be viewed here.</p>
    </div>
    <div id="msg"></div>
  </div>
</main>
<script>
(function(){
  var API = 'https://us-central1-ldah-932d5.cloudfunctions.net/lionsDohUpload';
  var k = new URLSearchParams(location.search).get('k') || '';
  var $ = function(id){ return document.getElementById(id); };
  var chosen = [], batchId = '', i = 0;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  function esc(x){ return String(x||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function say(t, cls){ $('msg').innerHTML = t ? '<span class="' + (cls||'') + '">' + esc(t) + '</span>' : ''; }
  function post(data){
    return fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({ k:k }, data)) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
  }
  if (!/^[a-f0-9]{48}$/.test(k)) { $('lead').innerHTML = '<span class="err">This link is incomplete. Please use the full link LDAH sent you.</span>'; return; }
  $('lead').textContent = 'Send LDAH the signed consent forms from a Lions screening.';
  post({ action:'check' }).then(function(){ $('stepUpload').style.display = ''; $('school').focus(); })
    .catch(function(e){ $('lead').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });

  var OK = { 'application/pdf':1, 'image/jpeg':1, 'image/png':1 };
  function setFiles(fl){
    batchId = ''; i = 0;
    var all = Array.prototype.slice.call(fl || []);
    chosen = all.filter(function(f){ return OK[f.type]; });
    var skipped = all.length - chosen.length;
    $('files').innerHTML = chosen.length + ' file' + (chosen.length===1?'':'s') + ' ready' + (skipped ? ' · <span class="err">' + skipped + ' skipped (not PDF, JPG or PNG)</span>' : '') + '<br>' +
      chosen.slice(0, 12).map(function(f){ return esc(f.name); }).join('<br>') + (chosen.length > 12 ? '<br>…' : '');
    $('send').disabled = !chosen.length;
  }
  var drop = $('drop'), pick = $('pick');
  drop.onclick = function(){ pick.click(); };
  drop.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click(); } };
  pick.onchange = function(){ setFiles(pick.files); };
  drop.ondragover = function(e){ e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function(){ drop.classList.remove('over'); };
  drop.ondrop = function(e){ e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); };

  $('send').onclick = function(){
    var school = $('school').value.trim();
    if (school.length < 2) { say('Please type the school name.', 'err'); $('school').focus(); return; }
    $('send').disabled = true; $('prog').style.display = 'block'; say('Sending…');
    var bar = $('prog').firstChild;
    (batchId ? Promise.resolve({ batchId: batchId }) : post({ action:'start', school: school })).then(function(j){
      batchId = j.batchId;
      return new Promise(function(done, fail){
        (function next(){
          if (i >= chosen.length) { done(); return; }
          var f = chosen[i];
          post({ action:'url', batchId: batchId, mimeType: f.type, sizeBytes: f.size }).then(function(u){
            return fetch(u.uploadUrl, { method:'PUT', headers:{'Content-Type': f.type}, body: f }).then(function(r){
              if (!r.ok) throw new Error('"' + f.name + '" did not finish uploading. Please try again.');
              return post({ action:'confirm', batchId: batchId, storagePath: u.storagePath, originalFilename: f.name, sizeBytes: f.size, mimeType: f.type });
            });
          }).then(function(){ i++; bar.style.width = Math.round(100 * i / chosen.length) + '%'; say('Sent ' + i + ' of ' + chosen.length + '…'); next(); }).catch(fail);
        })();
      });
    }).then(function(){ return post({ action:'finish', batchId: batchId }); }).then(function(j){
      $('card').innerHTML = '<div class="done"><h2>' + j.count + ' form' + (j.count===1?'':'s') + ' received, mahalo!</h2><p>LDAH has them for ' + esc(school) + '. To send another school, reload this page.</p></div>';
    }).catch(function(e){
      say(e.message + (i ? ' ' + i + ' of ' + chosen.length + ' are already sent. Press Send to LDAH again to send the rest.' : ''), 'err');
      $('send').disabled = false;
    });
  };
  post({ warm:true }).catch(function(){});
})();
</script>
</body>
</html>
