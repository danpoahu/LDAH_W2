<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0891B2">
<title>Screenings — LDAH Staff</title>
<!-- Installable (2026-10-05): "Screenings" on the home screen of the screening
     phone or iPad. No service worker on purpose, so it always loads fresh. -->
<link rel="manifest" href="screenings.webmanifest">
<link rel="apple-touch-icon" href="screenings-icon-192.png">
<meta name="apple-mobile-web-app-title" content="Screenings">
<script>
  window.__scrInstall = null;
  window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); window.__scrInstall = e; if (window.__scrInstallShow) window.__scrInstallShow(); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#0891B2; --blue-d:#0369A1; --ink:#1E293B; --soft:#64748B; --line:#E7EDF3; --bg:#F4F7FA;
    --pass:#16A34A; --fail:#B91C1C; --pend:#B45309; --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  [hidden] { display:none !important; }
  body { font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--ink); background:var(--bg); font-size:16px; line-height:1.5; }
  h1,h2,h3 { font-family:'Outfit',sans-serif; }
  input,select,button,textarea { font-family:inherit; font-size:16px; }
  .spinner { width:36px; height:36px; border:3px solid rgba(8,145,178,.2); border-top-color:var(--blue); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .full-center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--soft); }

  /* App bar */
  .bar { position:sticky; top:0; z-index:10; background:var(--blue); color:#fff; padding:calc(var(--safe-top) + 12px) 16px 12px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 10px rgba(8,145,178,.25); }
  .bar h1 { font-size:1.2rem; font-weight:600; flex:1; }
  .bar button { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-weight:600; font-size:.85rem; }
  .bar .back { background:rgba(255,255,255,.18); width:40px; height:40px; border-radius:10px; font-size:1.3rem; display:flex; align-items:center; justify-content:center; padding:0; }

  /* Filter row */
  .filters { display:flex; gap:8px; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  .chip { padding:9px 18px; border-radius:22px; border:1.5px solid var(--line); background:#fff; color:var(--soft); font-weight:600; font-size:.9rem; }
  .chip.on { border-color:var(--blue); background:var(--blue); color:#fff; }
  .filters .count { color:var(--soft); font-size:.85rem; margin-left:auto; }

  .wrap { padding:12px 12px calc(var(--safe-bot) + 24px); max-width:600px; margin:0 auto; }
  .empty { text-align:center; color:#94a3b8; padding:48px 20px; }

  /* Screening card */
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 8px rgba(15,40,70,.06); padding:16px; margin-bottom:12px; }
  .card .child { font-family:'Outfit',sans-serif; font-weight:600; font-size:1.15rem; color:var(--ink); }
  .card .parent { color:var(--soft); font-size:.9rem; margin-top:1px; }
  .card .when { color:#94a3b8; font-size:.82rem; margin-top:4px; }
  .badges { display:flex; gap:8px; margin:12px 0 14px; flex-wrap:wrap; }
  .badge { font-size:.8rem; font-weight:700; padding:5px 11px; border-radius:20px; }
  .b-consent { background:#DCFCE7; color:var(--pass); }
  .b-done { background:#DCFCE7; color:var(--pass); }
  .b-pend { background:#FEF3C7; color:var(--pend); }
  .card .act { width:100%; padding:13px; border:none; border-radius:12px; background:var(--blue); color:#fff; font-weight:700; font-size:1rem; }
  .card .act.edit { background:#fff; color:var(--blue-d); border:2px solid var(--blue); }
  /* One screening done, one to go (2026-10-05): orange so it's quick to spot. */
  .card .act.half { background:#fff; color:#EA580C; border:2px solid #EA580C; }

  /* Login */
  .login { max-width:400px; margin:0 auto; padding:calc(var(--safe-top) + 40px) 22px 40px; }
  .login img { width:76px; height:76px; display:block; margin:0 auto 18px; }
  .login h2 { text-align:center; color:var(--blue); font-size:1.4rem; margin-bottom:6px; }
  .login p.sub { text-align:center; color:var(--soft); margin-bottom:26px; font-size:.95rem; }
  .fld { margin-bottom:14px; }
  .fld label { display:block; font-weight:600; font-size:.9rem; margin-bottom:5px; }
  .fld input, .form input, .form select, .form textarea { width:100%; padding:13px 14px; border:1.5px solid #cbd5e1; border-radius:12px; background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; }
  .fld input:focus, .form input:focus, .form select:focus, .form textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(8,145,178,.15); }
  .btn-primary { width:100%; padding:15px; border:none; border-radius:12px; background:var(--blue); color:#fff; font-weight:700; font-size:1.05rem; }
  .btn-primary:disabled { opacity:.6; }
  .err { background:#FEE2E2; border:1px solid #FCA5A5; color:#991B1B; border-radius:10px; padding:10px 12px; margin-top:12px; font-size:.9rem; display:none; }
  .err.show { display:block; }

  /* Results entry form */
  .form { padding:16px 16px calc(var(--safe-bot) + 112px); max-width:600px; margin:0 auto; }
  .form .sec { font-family:'Outfit',sans-serif; font-weight:700; color:var(--blue); font-size:1.05rem; margin:20px 0 8px; padding-bottom:5px; border-bottom:2px solid #E0F2FE; }
  .form label.l { display:block; font-weight:600; font-size:.92rem; margin:14px 0 5px; }
  .rl { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px; }
  .rl .lab { font-size:.9rem; color:#475569; }
  .rl .h { font-size:.68rem; color:#94a3b8; font-weight:700; text-transform:uppercase; }
  .form select { padding:11px 10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .savebar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px calc(var(--safe-bot) + 12px); display:flex; flex-wrap:wrap; gap:10px; z-index:20; }
  .savebar button { flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:.98rem; border:none; }
  .savebar .save { background:#fff; color:var(--blue-d); border:2px solid var(--blue); }
  .savebar .email { background:var(--blue); color:#fff; }
  .savebar .email:disabled { background:#94a3b8; }
  /* Station screening (2026-10-05): vision and hearing are done at different
     stations by different screeners, so the family email waits for both. */
  .savebar .lockNote { flex:1 1 100%; text-align:center; font-size:.82rem; color:var(--soft); margin-top:-4px; }
  .otherBox { background:#F8FAFC; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:4px; font-size:.9rem; }
  .otherBox .ol { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; padding:2px 0; }
  .otherBox .ol b { font-family:'Outfit',sans-serif; font-weight:600; }
  .otherBox .ok { color:var(--pass); } .otherBox .todo { color:var(--pend); }
  .otherBox .det { color:var(--soft); font-size:.82rem; }
  /* Floats just above the Save bar (2026-09-30): it used to sit under the
     form, behind the fixed bar, so "email failed" and "timed out" were never seen. */
  #entryMsg { position:fixed; left:12px; right:12px; bottom:calc(var(--safe-bot) + 104px); z-index:21; text-align:center; font-size:.95rem; font-weight:700; pointer-events:none; }
  #entryMsg:not(:empty) { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:0 6px 20px rgba(15,23,42,.15); pointer-events:auto; }
  /* Location / classroom / date pickers (2026-09-30): pick a school and a class
     and the roster shows, whatever date the consent was signed. */
  .pick { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 10px; max-width:720px; margin:0 auto; }
  .pick label { font-size:12px; font-weight:700; color:var(--soft); display:flex; flex-direction:column; gap:3px; flex:1 1 150px; }
  .pick select, .pick input { font:inherit; font-size:15px; padding:8px 10px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .badge.b-class { background:#EDE9FE; color:#5B21B6; }
  /* Tap buttons instead of dropdowns (2026-09-30): one tap per ear, and a
     "Both" button for the usual answer. Values saved are unchanged. */
  .rl2 { display:grid; grid-template-columns:72px 1fr 54px; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid #F1F5F9; }
  .rl2 .lab { font-size:.88rem; color:#475569; font-weight:600; line-height:1.2; }
  .ears { display:grid; grid-template-columns:1fr 1fr; gap:10px; min-width:0; }
  .ear { display:flex; align-items:center; gap:5px; min-width:0; }
  .eh { font-size:.7rem; font-weight:800; color:#94a3b8; width:11px; flex:none; text-align:center; }
  .seg { display:flex; gap:4px; flex:1; min-width:0; }
  .sb { flex:1 1 0; min-width:0; min-height:42px; padding:0 2px; border:1.5px solid #cbd5e1; border-radius:9px; background:#fff; color:var(--ink);
        font:700 .8rem 'Source Sans 3',sans-serif; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; touch-action:manipulation; }
  .sb.on.p { background:var(--pass); border-color:var(--pass); color:#fff; }
  .sb.on.f { background:var(--fail); border-color:var(--fail); color:#fff; }
  .sb.on.o { background:var(--pend); border-color:var(--pend); color:#fff; }
  .both { min-height:42px; border:1.5px dashed var(--blue); background:#F0F9FF; color:var(--blue-d); border-radius:9px;
          font:800 .72rem 'Source Sans 3',sans-serif; line-height:1.1; cursor:pointer; padding:0 4px; touch-action:manipulation; }
  .both:active, .sb:active { transform:scale(.96); }
  /* Printout photo (2026-09-30): the vision screener's printout, photographed on the phone. */
  .photoBox { margin-top:10px; }
  .photoBtn { width:100%; min-height:48px; border:2px dashed var(--blue); background:#F0F9FF; color:var(--blue-d); border-radius:12px;
              font:700 1rem 'Source Sans 3',sans-serif; cursor:pointer; touch-action:manipulation; }
  .photoBtn:active { transform:scale(.98); }
  .pList { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .slotRow { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .slot .photoBtn { min-height:64px; font-size:.95rem; }
  .slot .pItem { min-height:64px; }
  .pItem { border:1px solid var(--line); border-radius:10px; padding:6px; background:#fff; font-size:.8rem; color:var(--soft); text-align:center; }
  .pItem img { display:block; max-width:140px; max-height:140px; border-radius:6px; margin:0 auto 4px; }
  .pItem button { font:700 .8rem 'Source Sans 3',sans-serif; color:var(--blue-d); background:none; border:none; cursor:pointer; padding:4px; }
  #ePhotoMsg { font-size:.85rem; margin-top:6px; color:var(--soft); }
  @media (max-width:520px){ .rl2 { grid-template-columns:1fr 54px; } .rl2 .lab { grid-column:1 / -1; } .ears { grid-template-columns:1fr; gap:6px; } }
</style>
</head>
<body>

<div id="loading" class="full-center"><div class="spinner"></div><p>Loading…</p></div>

<!-- Login -->
<div id="login" class="login" style="display:none;">
  <img src="/logo_blue.png" alt="LDAH">
  <h2>Screenings</h2>
  <p class="sub">LDAH staff sign-in</p>
  <form id="loginForm">
    <div class="fld"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="username" inputmode="email" required></div>
    <div class="fld"><label for="lPass">Password</label><input type="password" id="lPass" autocomplete="current-password" required></div>
    <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    <div id="loginErr" class="err"></div>
  </form>
  <button type="button" class="installBtn" id="installAppLogin" hidden style="margin-top:14px;width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:11px;font-weight:600;font-size:1rem;">Install Screenings on this device</button>
</div>

<!-- Report -->
<div id="report" style="display:none;">
  <div class="bar"><h1>Screenings</h1><button id="installApp" class="installBtn" hidden>Install</button><button id="signOut">Sign out</button></div>
  <div class="filters">
    <button class="chip on" id="cToday" onclick="setFilter('today')">Today</button>
    <button class="chip" id="cAll" onclick="setFilter('all')">All</button>
    <span class="count" id="count"></span>
  </div>
  <div class="pick">
    <label>Screening date<input type="date" id="fDate" onchange="setDate(this.value)"></label>
    <label>Location<select id="fLoc" onchange="setLoc(this.value)"><option value="">Signed today / all</option></select></label>
    <label>Classroom<select id="fClass" onchange="setClass(this.value)"><option value="">All classrooms</option></select></label>
  </div>
  <div class="wrap" id="list"></div>
</div>

<!-- Results entry -->
<div id="entry" style="display:none;">
  <div class="bar"><button class="back" onclick="closeEntry()">&#8249;</button><h1 id="entryTitle">Results</h1></div>
  <div class="form" id="entryForm"></div>
  <div class="savebar">
    <button class="save" id="btnSave" onclick="saveEntry(false)">Save</button>
    <!-- Family results go out in one bulk email after the event (Daniel 2026-10-05),
         so the per-child email button is kept in the code but never shown. -->
    <button class="email" id="btnEmail" onclick="saveEntry(true)" style="display:none">Save &amp; email family</button>
    <div class="lockNote" id="emailNote" hidden style="display:none">Email unlocks when vision and hearing are both done</div>
  </div>
  <div id="entryMsg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
    authDomain: "ldah-932d5.firebaseapp.com",
    projectId: "ldah-932d5",
    storageBucket: "ldah-932d5.firebasestorage.app",
    messagingSenderId: "662130454003",
    appId: "1:662130454003:web:437576d5a5811ecd8df686"
  });
  const auth = firebase.auth();
  const db = firebase.firestore();
  // Force long-polling. Firestore's default streaming (WebChannel/QUIC) connection
  // can be silently disrupted by some browsers, extensions, or networks — reads
  // load, then writes hang with no error (staff saw this in Edge & Chrome). Long-
  // polling is far more robust for a kiosk-style tool used across varied browsers.
  try { db.settings({ experimentalForceLongPolling: true }); } catch (e) {}
  const SEND_RESULTS = 'https://us-central1-ldah-932d5.cloudfunctions.net/sendScreeningResults';
  const $ = id => document.getElementById(id);
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function view(v){ ['loading','login','report','entry'].forEach(id=>$(id).style.display='none'); $(v).style.display='block'; }

  /* PURE-BEGIN — station screening (2026-10-05). Pure functions only (no DOM,
     no Firestore): scratchpad results_merge_test.js extracts and tests this block.
     COMPLETE = both parts done:
       Vision  done = distance right AND left have a result.
       Hearing done = otoscopy right AND left, OAE right AND left have a result,
                      plus tympanometry for any ear whose OAE is "Fail" (the
                      family page says tympanometry is done when OAE fails).
     "Could not test" counts as a result. Lea Symbols / PlusOptix is free text
     and never required. */
  const RESULT_PATHS = ['hearing.otoscopy.right','hearing.otoscopy.left','hearing.oae.right','hearing.oae.left',
    'hearing.tympanometry.right','hearing.tympanometry.left','vision.distance.right','vision.distance.left','vision.leaSymbols'];
  function _filled(v){ return typeof v === 'string' ? v.trim() !== '' : (v != null && v !== ''); }
  function _resultsOf(s){
    if (!s || typeof s !== 'object') return {};
    if (s.results && typeof s.results === 'object') return s.results;
    if (s.hearing || s.vision) return s;   // a results object passed directly
    return {};
  }
  function _getPath(o, path){ return path.split('.').reduce((a,k)=>(a && typeof a === 'object') ? a[k] : undefined, o); }
  // Copies only the objects along the path, so untouched values (Firestore
  // Timestamps like resultsSentAt) are kept as they are.
  function _setPath(o, path, value){
    const k = path.split('.'), root = Object.assign({}, o||{}); let cur = root;
    for (let i=0;i<k.length-1;i++){ const nx = (cur[k[i]] && typeof cur[k[i]] === 'object') ? Object.assign({}, cur[k[i]]) : {}; cur[k[i]] = nx; cur = nx; }
    cur[k[k.length-1]] = value; return root;
  }
  function screeningParts(s){
    const r = _resultsOf(s), h = r.hearing || {}, v = r.vision || {};
    const pair = o => !!o && _filled(o.right) && _filled(o.left);
    const oae = h.oae || {}, ty = h.tympanometry || {};
    let hearing = pair(h.otoscopy) && pair(h.oae);
    if (hearing && oae.right === 'Fail' && !_filled(ty.right)) hearing = false;
    if (hearing && oae.left === 'Fail' && !_filled(ty.left)) hearing = false;
    return { vision: pair(v.distance) ? 'done' : 'todo', hearing: hearing ? 'done' : 'todo' };
  }
  function isComplete(s){ const p = screeningParts(s); return p.vision === 'done' && p.hearing === 'done'; }
  /* Merge one screener's changes into the latest saved results.
     patch.fields = { 'hearing.oae.right':'Pass', 'site':'…', … } — ONLY the
     fields this screener changed. Everything else in base is kept. A section
     with any changed field gets <section>At / <section>By / <section>ByUid. */
  function mergeResults(base, patch){
    let out = Object.assign({}, base || {});
    const f = (patch && patch.fields) || {}, secs = {};
    Object.keys(f).forEach(p => { out = _setPath(out, p, f[p]); const s = p.split('.')[0]; if (s === 'hearing' || s === 'vision') secs[s] = 1; });
    RESULT_PATHS.forEach(p => { if (_getPath(out, p) === undefined) out = _setPath(out, p, ''); });  // same shape as before
    ['site','screenedAt','screenedBy'].forEach(k => { if (out[k] === undefined) out[k] = ''; });
    const st = patch && patch.stamp;
    if (st) Object.keys(secs).forEach(s => { out[s+'At'] = st.at; out[s+'By'] = st.by || ''; if (st.uid) out[s+'ByUid'] = st.uid; });
    return out;
  }
  // Replace the screening with this id inside a contact's screenings array.
  function applyToScreening(list, screeningId, fn){
    let found = false, item = null;
    const out = (Array.isArray(list) ? list : []).map(s => { if (!found && s && s.id === screeningId){ found = true; item = fn(s); return item; } return s; });
    return { list: out, found, item };
  }
  /* PURE-END */

  let filter = 'today';
  let rows = [];
  let current = null; // { contactId, screeningId, child }
  let unsub = null;   // Firestore realtime listener
  // Day defaults for Site + Screened by. Once entered on any screening, they
  // auto-fill the rest of the day — and persist across browsers/devices via a
  // Firestore doc (not localStorage), keyed to today's date.
  let dayDefaults = { site:'', screenedBy:'' };
  function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function loadDayDefaults(){
    db.collection('screeningDefaults').doc('current').get().then(d=>{
      const v = d.exists ? (d.data()||{}) : {};
      if (v.dateKey === todayKey()) dayDefaults = { site:v.site||'', screenedBy:v.screenedBy||'' };
    }).catch(()=>{});
  }

  auth.onAuthStateChanged(async u => {
    if (!u){ if (unsub){ unsub(); unsub=null; } view('login'); return; }
    // This page and the member portal share the same origin + Firebase project, so
    // a member-portal login (a non-staff account) can carry over here. Only
    // admin/superAdmin can write results — if the signed-in account isn't one of
    // those, say so clearly instead of loading the form and failing on every save.
    let role = '';
    try { const rs = await db.collection('userRoles').doc(u.uid).get(); role = rs.exists ? (rs.data().role || '') : ''; } catch (e) {}
    if (role === 'admin' || role === 'superAdmin'){ startReport(); }
    else {
      if (unsub){ unsub(); unsub=null; }
      view('login');
      const err = $('loginErr');
      err.innerHTML = 'You are signed in as <b>' + esc(u.email || 'this account') + '</b>, which is <b>not authorized</b> to enter screening results. Sign in below with your LDAH staff account (this replaces the current sign-in), or <a href="#" id="switchAcct">sign out</a> first.';
      err.classList.add('show');
      const sw = document.getElementById('switchAcct'); if (sw) sw.onclick = (e) => { e.preventDefault(); auth.signOut(); };
    }
  });

  // ---- Login ----
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('loginBtn'); const err = $('loginErr');
    err.classList.remove('show'); btn.disabled = true; btn.textContent = 'Signing in…';
    try { await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lPass').value); }
    catch (ex){ err.textContent = (ex.code==='auth/invalid-credential'||ex.code==='auth/wrong-password'||ex.code==='auth/user-not-found') ? 'Incorrect email or password.' : ('Sign-in failed: '+ex.message); err.classList.add('show'); btn.disabled=false; btn.textContent='Sign in'; }
  });
  $('signOut').addEventListener('click', () => auth.signOut());

  // ---- Report ----
  window.setFilter = function(f){ filter=f; $('cToday').className='chip'+(f==='today'?' on':''); $('cAll').className='chip'+(f==='all'?' on':''); renderList(); };

  function buildRows(snap){
    rows = [];
    // Sandbox (test) contacts are invisible unless the signed-in user is one of
    // its sandboxViewers. Filtered here so pickers, list and counts never see them.
    const me = (auth.currentUser && auth.currentUser.uid) || '';
    snap.forEach(doc => { const c = doc.data()||{};
      if (c.sandbox === true && !(me && Array.isArray(c.sandboxViewers) && c.sandboxViewers.indexOf(me) !== -1)) return;
      const list = Array.isArray(c.screenings)?c.screenings:[];
      list.forEach(s => { if(!s) return; rows.push({ contactId:doc.id, screeningId:s.id||'', child:s.child||{},
        childName:(((s.child&&s.child.firstName)||'')+' '+((s.child&&s.child.lastName)||'')).trim(),
        parentName:c.displayName||(((c.firstName||'')+' '+(c.lastName||'')).trim()), email:c.email||'',
        signedAt:s.signedAt, results:s.results||null, resultsSent:!!(s.results&&s.results.resultsSentAt),
        location:s.location||'', classroom:s.classroom||'', printouts:Array.isArray(s.printouts)?s.printouts:[] }); });
    });
  }
  // Realtime listener — new consents & results appear live, on any device, no refresh.
  function startReport(){
    view('report');
    loadDayDefaults();
    if (!unsub) $('list').innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 12px;"></div>Loading screenings…</div>';
    if (unsub) return;
    unsub = db.collection('contacts').where('hasScreenings','==',true).onSnapshot(
      snap => { buildRows(snap); fillPickers(); renderList(); refreshOpenEntry(); },
      err => { $('list').innerHTML = '<div class="empty">Couldn’t load: '+esc(err.message)+'</div>'; }
    );
  }

  function isToday(ts){ if(!ts||!ts.toDate) return false; const d=ts.toDate(), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }

  /* ---- Location / classroom / date ----
     A school roster (e.g. Pali View's paper consents) was signed weeks before
     screening day, so "Today" never shows it. Picking the location lists every
     child there, whatever date they signed; the classroom narrows it to one
     room. The screening date is what each result is stamped with. The choices
     are remembered on this device. */
  let pick = { loc:'', cls:'', date:'' };
  try { pick = Object.assign(pick, JSON.parse(localStorage.getItem('srpPick')||'{}')); } catch(e){}
  function savePick(){ try { localStorage.setItem('srpPick', JSON.stringify(pick)); } catch(e){} }
  function fillPickers(){
    const locs = {}; rows.forEach(r=>{ if(r.location){ const L = locs[r.location] = locs[r.location] || { n:0, pend:0, cls:{} }; L.n++; if(!isComplete(r.results)) L.pend++; if(r.classroom) L.cls[r.classroom]=(L.cls[r.classroom]||0)+1; } });
    if (pick.loc && !locs[pick.loc]) { pick.loc=''; pick.cls=''; }
    const ls = $('fLoc'); if (ls) ls.innerHTML = '<option value="">Signed today / all</option>' + Object.keys(locs).sort().map(k=>'<option value="'+esc(k)+'"'+(k===pick.loc?' selected':'')+'>'+esc(k)+' ('+locs[k].pend+' to screen)</option>').join('');
    const cl = pick.loc && locs[pick.loc] ? Object.keys(locs[pick.loc].cls).sort() : [];
    if (pick.cls && cl.indexOf(pick.cls)===-1) pick.cls='';
    const cs = $('fClass'); if (cs){ cs.innerHTML = '<option value="">All classrooms</option>' + cl.map(k=>'<option value="'+esc(k)+'"'+(k===pick.cls?' selected':'')+'>'+esc(k)+' ('+locs[pick.loc].cls[k]+')</option>').join(''); cs.disabled = !pick.loc; }
    const fd = $('fDate'); if (fd && !fd.value) fd.value = pick.date || todayKey();
  }
  window.setLoc = function(v){ pick.loc=v||''; pick.cls=''; savePick(); fillPickers(); renderList(); };
  window.setClass = function(v){ pick.cls=v||''; savePick(); renderList(); };
  window.setDate = function(v){ pick.date=v||''; savePick(); };

  function renderList(){
    const byLoc = !!pick.loc;
    $('cToday').style.opacity = byLoc ? '.45' : ''; $('cAll').style.opacity = byLoc ? '.45' : '';
    let list = byLoc ? rows.filter(r=>r.location===pick.loc && (!pick.cls || r.classroom===pick.cls))
                     : (filter==='today' ? rows.filter(r=>isToday(r.signedAt)) : rows.slice());
    // Not complete (vision or hearing still to do) float to the TOP so Chassidy
    // sees who's next; within each group, most recently signed first.
    list.sort((a,b)=>{
      const ap=isComplete(a.results)?1:0, bp=isComplete(b.results)?1:0;
      if(ap!==bp) return ap-bp;
      if(byLoc){ const c=(a.classroom||'').localeCompare(b.classroom||''); if(c) return c; return (a.childName||'').localeCompare(b.childName||''); }
      return ((b.signedAt&&b.signedAt.toMillis)?b.signedAt.toMillis():0)-((a.signedAt&&a.signedAt.toMillis)?a.signedAt.toMillis():0);
    });
    $('count').textContent = byLoc
      ? list.length + (list.length===1?' child':' children') + ' \u00b7 ' + list.filter(r=>!isComplete(r.results)).length + ' to screen'
      : list.length + (list.length===1?' screening':' screenings') + (filter==='today'?' today':'');
    if (!list.length){ $('list').innerHTML = '<div class="empty">No screenings'+(filter==='today'?' today yet':'')+'.</div>'; return; }
    let h='';
    list.forEach((r,i)=>{
      const when = (r.signedAt&&r.signedAt.toDate)?r.signedAt.toDate().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
      // A child stays "to screen" until BOTH parts are done (2026-10-05).
      const done = isComplete(r.results), parts = screeningParts(r.results);
      const partBadge = (lbl, st) => st==='done' ? '<span class="badge b-done">'+lbl+' ✓</span>' : '<span class="badge b-pend">'+lbl+' to do</span>';
      const resBadge = done ? '<span class="badge b-done">Results '+(r.resultsSent?'sent':'done')+'</span>'
        : partBadge('Vision', parts.vision) + partBadge('Hearing', parts.hearing) + (r.resultsSent?'<span class="badge b-done">Results sent</span>':'');
      h += '<div class="card">'+
        '<div class="child">'+esc(r.childName||'Child')+'</div>'+
        '<div class="parent">'+esc(r.parentName||'')+'</div>'+
        '<div class="when">Signed '+esc(when)+'</div>'+
        '<div class="badges">'+(r.classroom?'<span class="badge b-class">'+esc(r.classroom)+'</span>':'')+'<span class="badge b-consent">Consent ✓</span>'+resBadge+'</div>'+
        '<button class="act'+(done?' edit':((parts.vision==='done')!==(parts.hearing==='done')?' half':''))+'" onclick="openEntry('+i+')">'+(done?'Edit results':'Add results')+'</button>'+
      '</div>';
    });
    $('list').innerHTML = h;
    window._view = list;
  }

  // ---- Results entry ----
  const PF = ['','Pass','Fail','Could not test'];
  const OTO = ['','Clear or minimal earwax','Excessive earwax','Blood or foreign object','P.E. tube'];
  function selHtml(id, opts, cur){ return '<select id="'+id+'">'+opts.map(o=>'<option value="'+esc(o)+'"'+(cur===o?' selected':'')+'>'+(o||'—')+'</option>').join('')+'</select>'; }
  const SHORT = { 'Pass':'P', 'Fail':'F', 'Could not test':'CNT', 'Clear or minimal earwax':'Clear', 'Excessive earwax':'Wax', 'Blood or foreign object':'Blood', 'P.E. tube':'Tube' };
  function tone(v){ return (v==='Pass'||v==='Clear or minimal earwax') ? 'p' : (v==='Fail' ? 'f' : 'o'); }
  function segHtml(id, opts, cur){
    return '<input type="hidden" id="'+id+'" value="'+esc(cur||'')+'"><div class="seg" data-for="'+id+'">' +
      opts.filter(o=>o).map(o=>'<button type="button" class="sb '+tone(o)+(cur===o?' on':'')+'" data-v="'+esc(o)+'" title="'+esc(o)+'" onclick="segPick(this)">'+esc(SHORT[o]||o)+'</button>').join('') + '</div>';
  }
  function rlRow(label, rId, lId, opts, val, bothV, bothLbl){
    val=val||{};
    return '<div class="rl2"><div class="lab">'+label+'</div><div class="ears">' +
      '<div class="ear"><span class="eh">R</span>'+segHtml(rId,opts,val.right)+'</div>' +
      '<div class="ear"><span class="eh">L</span>'+segHtml(lId,opts,val.left)+'</div></div>' +
      '<button type="button" class="both" title="Set right and left to '+esc(bothV)+'" onclick="segBoth(\''+rId+'\',\''+lId+'\',\''+esc(bothV)+'\')">'+bothLbl+'</button></div>';
  }
  function segSet(id, v){
    const inp=$(id); if(!inp) return; inp.value=v;
    const seg=document.querySelector('.seg[data-for="'+id+'"]');
    if(seg) seg.querySelectorAll('.sb').forEach(x=>x.classList.toggle('on', x.getAttribute('data-v')===v));
  }
  /* Tap again to clear a choice. */
  window.segPick = function(b){ const id=b.parentNode.getAttribute('data-for'), v=b.getAttribute('data-v'); segSet(id, $(id).value===v ? '' : v); markTouched(id); };
  window.segBoth = function(r, l, v){ segSet(r, v); segSet(l, v); markTouched(r); markTouched(l); };

  /* ---- Station screening: who changed what (2026-10-05) ----
     Each form field maps to one path in results. Only fields THIS screener
     changed are saved, so the hearing station never overwrites vision (or
     the other way round) from an old copy. */
  const FORM_FIELDS = [
    { id:'eOtoR', path:'hearing.otoscopy.right' }, { id:'eOtoL', path:'hearing.otoscopy.left' },
    { id:'eOaeR', path:'hearing.oae.right' }, { id:'eOaeL', path:'hearing.oae.left' },
    { id:'eTympR', path:'hearing.tympanometry.right' }, { id:'eTympL', path:'hearing.tympanometry.left' },
    { id:'eDistR', path:'vision.distance.right' }, { id:'eDistL', path:'vision.distance.left' },
    { id:'eLea', path:'vision.leaSymbols' },
    { id:'eDate', path:'screenedAt', common:true }, { id:'eSite', path:'site', common:true }, { id:'eBy', path:'screenedBy', common:true }
  ];
  let saving = false;
  function storedVal(base, path){ const v=_getPath(base||{}, path); if (path==='screenedAt' && v && v.toDate){ const d=v.toDate(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } return v==null ? '' : String(v).trim(); }
  function markTouched(id){ if (current){ current.touched[id] = true; updateLock(); } }
  // The fields to save: changed by this screener since the form opened (or
  // since the last live refresh). Site / date / screened-by are pre-filled
  // from the day's defaults, so they are also saved when nothing is stored yet.
  function buildPatch(withStamp){
    const fields = {};
    if (!current) return { fields };
    FORM_FIELDS.forEach(f => {
      const v = val(f.id);
      if (v === current.initial[f.id]) return;
      if (current.touched[f.id] || (f.common && v !== '' && storedVal(current.base, f.path) === '')) fields[f.path] = v;
    });
    const u = auth.currentUser || {};
    return withStamp ? { fields, stamp:{ at: firebase.firestore.Timestamp.now(), by: u.displayName || u.email || '', uid: u.uid || '' } } : { fields };
  }
  function updateLock(){
    if (!current) return;
    const ok = isComplete(mergeResults(current.base, buildPatch(false)));
    if (!saving) $('btnEmail').disabled = !ok;
    $('emailNote').hidden = ok;
  }
  // Read-only line per part, from what is SAVED (refreshed live).
  function otherHtml(base){
    const b = base || {}, p = screeningParts(b);
    const pairTxt = o => o && (o.right||o.left) ? 'R '+(SHORT[o.right]||o.right||'—')+' · L '+(SHORT[o.left]||o.left||'—') : '';
    const at = t => (t && t.toDate) ? t.toDate().toLocaleString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
    const line = (lbl, key, det) => {
      const by = b[key+'By'] || '', when = at(b[key+'At']);
      return p[key]==='done'
        ? '<div class="ol"><b class="ok">'+lbl+' ✓</b><span>done'+(by?' by '+esc(by):'')+(when?' at '+esc(when):'')+'</span>'+(det?'<span class="det">'+esc(det)+'</span>':'')+'</div>'
        : '<div class="ol"><b class="todo">'+lbl+' to do</b>'+(det?'<span class="det">saved so far: '+esc(det)+'</span>':'')+'</div>';
    };
    const h = b.hearing || {}, v = b.vision || {};
    const hDet = [h.otoscopy&&(h.otoscopy.right||h.otoscopy.left)?'Oto '+pairTxt(h.otoscopy):'', h.oae&&(h.oae.right||h.oae.left)?'OAE '+pairTxt(h.oae):'', h.tympanometry&&(h.tympanometry.right||h.tympanometry.left)?'Tymp '+pairTxt(h.tympanometry):''].filter(Boolean).join('; ');
    return line('Vision','vision', pairTxt(v.distance)) + line('Hearing','hearing', hDet);
  }
  // Live refresh: called on every contacts snapshot. Shows the other station's
  // saved results and updates any field this screener has not changed. Fields
  // this screener changed are left exactly as typed.
  function refreshOpenEntry(){
    if (!current || $('entry').style.display !== 'block') return;
    const r = rows.find(x => x.contactId===current.contactId && x.screeningId===current.screeningId);
    if (!r) return;
    current.base = r.results || {};
    FORM_FIELDS.forEach(f => {
      if (f.common) return;   // site / date / screened-by stay as this screener has them
      const now = val(f.id); if (now !== current.initial[f.id]) return;
      const sv = storedVal(current.base, f.path); if (sv === now) return;
      if (f.id === 'eLea'){ const t=$('eLea'); if (t && document.activeElement !== t) t.value = sv; else return; } else segSet(f.id, sv);
      current.initial[f.id] = sv;
    });
    if (JSON.stringify(r.printouts||[]) !== JSON.stringify(current.printouts)){ current.printouts = (r.printouts||[]).slice(); renderSlots(); }
    const ob = $('eOther'); if (ob) ob.innerHTML = otherHtml(current.base);
    updateLock();
  }

  window.openEntry = function(i){
    const r = window._view[i]; if(!r) return;
    current = { contactId:r.contactId, screeningId:r.screeningId, printouts:(r.printouts||[]).slice(), base:(r.results||{}), touched:{}, initial:{} };
    Object.keys(_fresh).forEach(k=>delete _fresh[k]);
    $('entryTitle').textContent = r.childName || 'Results';
    const res = r.results||{}, hd=res.hearing||{}, vs=res.vision||{};
    const by = res.screenedBy || dayDefaults.screenedBy || (auth.currentUser && auth.currentUser.displayName) || '';
    const site = res.site || (r.location ? r.location + (r.classroom ? ' \u2014 ' + r.classroom : '') : '') || dayDefaults.site || '';
    let when = '';
    if (res.screenedAt){ if(res.screenedAt.toDate){const d=res.screenedAt.toDate();when=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');} else if(typeof res.screenedAt==='string'){when=res.screenedAt.slice(0,10);} }
    if(!when && pick.date) when = pick.date;
    if(!when){ const t=new Date(); when=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
    let f = '';
    f += '<div class="otherBox" id="eOther">'+otherHtml(current.base)+'</div>';
    f += '<div class="grid2"><div><label class="l">Date of Screening</label><input type="date" id="eDate" value="'+when+'"></div>'+
         '<div><label class="l">Site</label><input id="eSite" value="'+esc(site)+'"></div></div>';
    f += '<label class="l">Screened by</label><input id="eBy" value="'+esc(by)+'">';
    f += '<div class="sec">Hearing</div>';
    f += rlRow('Otoscopy','eOtoR','eOtoL',OTO,hd.otoscopy,'Clear or minimal earwax','Both<br>Clear');
    f += rlRow('OAE','eOaeR','eOaeL',PF,hd.oae,'Pass','Both<br>Pass');
    f += rlRow('Tympano&shy;metry','eTympR','eTympL',PF,hd.tympanometry,'Pass','Both<br>Pass');
    f += '<div class="sec">Vision</div>';
    f += rlRow('Distance','eDistR','eDistL',PF,vs.distance,'Pass','Both<br>Pass');
    f += '<label class="l">Lea Symbols / PlusOptix</label><textarea id="eLea" rows="2">'+esc(vs.leaSymbols||'')+'</textarea>';
    /* Three images per child (10-08). capture= opens the camera straight away,
       no Take Photo / Library menu (Daniel: no extra clicks). */
    f += '<div class="photoBox"><label class="l">Images</label><input type="file" id="ePhoto" accept="image/*" capture="environment" style="display:none" onchange="uploadPrintout(this)">' +
         '<div class="slotRow">'+[1,2,3].map(n=>'<div class="slot" id="slot'+n+'">'+slotHtml(n)+'</div>').join('')+'</div><div id="ePhotoMsg"></div></div>';
    $('entryForm').innerHTML = f;
    // "initial" = what is SAVED, not what is pre-filled, so a pre-filled site /
    // date / screened-by still counts as new on the first save.
    FORM_FIELDS.forEach(fd => { current.initial[fd.id] = storedVal(current.base, fd.path); });
    ['eDate','eSite','eBy','eLea'].forEach(id => { const el=$(id); if (el){ el.addEventListener('input', () => markTouched(id)); el.addEventListener('change', () => markTouched(id)); } });
    $('entryMsg').textContent = '';
    saving = false;
    $('btnSave').disabled=false; $('btnEmail').disabled=false; $('btnSave').textContent='Save'; $('btnEmail').textContent='Save & email family';
    updateLock();
    view('entry'); window.scrollTo(0,0);
  };
  window.closeEntry = function(){ view('report'); current = null; };

  /* ---- Printout photo ----
     Uploads go through the same private, staff-only route as paper consents:
     the function hands back a one-time upload link for this child's folder,
     and every later view is a short-lived signed link that is audit-logged.
     The photo is attached to the screening straight away, so it is kept even
     if Save is never pressed. */
  const UPLOAD_FN = 'https://us-central1-ldah-932d5.cloudfunctions.net/requestScreeningConsentUploadUrl';
  const VIEW_FN = 'https://us-central1-ldah-932d5.cloudfunctions.net/getScreeningConsentDownloadUrl';
  /* Image 1 / 2 / 3 (10-08). Each photo is a printouts[] entry with a slot.
     Entries saved before slots existed take slot 1, 2, 3 in the order taken.
     A retake replaces that slot's entry; the old file stays in Storage. */
  const slotOf = (p, i) => Number(p && p.slot) || Math.min(i + 1, 3);
  function slotEntry(n){ const l=(current&&current.printouts)||[]; let hit=null; l.forEach((p,i)=>{ if(slotOf(p,i)===n) hit=p; }); return hit; }
  const _fresh = {};
  function slotHtml(n){
    const p = slotEntry(n);
    if (!p) return '<button type="button" class="photoBtn" onclick="pickSlot('+n+')">+ Image '+n+'</button>';
    const img = _fresh[n] ? '<img src="'+_fresh[n]+'" alt="Image '+n+'">' : '';
    return '<div class="pItem">'+img+'<b>Image '+n+' \u2713</b><br>' +
      (_fresh[n] ? '' : '<button type="button" onclick="viewSlot('+n+')">View</button>') +
      '<button type="button" onclick="pickSlot('+n+')">Replace</button></div>';
  }
  function renderSlots(){ [1,2,3].forEach(n=>{ const el=$('slot'+n); if(el) el.innerHTML=slotHtml(n); }); }
  let _slot = 1;
  window.pickSlot = function(n){ _slot = n; const i=$('ePhoto'); if(i) i.click(); };
  function shrink(file){
    return createImageBitmap(file).then(bm=>{
      const max=2000, k=Math.min(1, max/Math.max(bm.width,bm.height));
      const c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('no blob')),'image/jpeg',0.85));
    });
  }
  window.uploadPrintout = async function(inp){
    const file = inp.files && inp.files[0]; inp.value=''; if(!file||!current) return;
    const cur = current;   // the child this photo belongs to, even if the form is closed mid-upload
    const slot = _slot;
    const msg=$('ePhotoMsg'); msg.style.color='var(--soft)'; msg.textContent='Preparing the photo\u2026';
    let blob=file, type=file.type||'image/jpeg';
    try { blob = await shrink(file); type='image/jpeg'; } catch(e){ blob=file; }
    try {
      const idToken = await auth.currentUser.getIdToken();
      const r = await fetch(UPLOAD_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken,contactId:cur.contactId,mimeType:type,sizeBytes:blob.size,kind:'printout'})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok||!j.uploadUrl) throw new Error(j.error||'Could not start the upload.');
      await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT', j.uploadUrl); x.setRequestHeader('Content-Type', type);
        x.upload.onprogress=e=>{ if(e.lengthComputable) msg.textContent='Uploading\u2026 '+Math.round(e.loaded/e.total*100)+'%'; };
        x.onload=()=> (x.status>=200&&x.status<300)?res():rej(new Error('Upload failed ('+x.status+'). Try again.'));
        x.onerror=()=>rej(new Error('Upload failed. Check the connection and try again.')); x.send(blob); });
      const entry={ storagePath:j.storagePath, uploadedAt:new Date().toISOString(), by:(auth.currentUser.displayName||auth.currentUser.email||''), slot:slot };
      // Transaction (2026-10-05): re-reads the contact and appends ONLY this
      // photo, so it can never undo results another screener just saved.
      const ref=db.collection('contacts').doc(cur.contactId);
      const saved = await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        const out = applyToScreening(((snap.data()||{}).screenings)||[], cur.screeningId, s => Object.assign({}, s, { printouts:(Array.isArray(s.printouts)?s.printouts:[]).filter((p,i)=>slotOf(p,i)!==slot).concat([entry]) }));
        if (!out.found) throw new Error('This child\u2019s screening was not found. Nothing was saved.');
        tx.update(ref, { screenings: out.list });
        return out.item.printouts;
      });
      cur.printouts = saved.slice();
      if (current !== cur) return;
      _fresh[slot] = URL.createObjectURL(blob); renderSlots();
      msg.style.color='var(--pass)'; msg.textContent='Image '+slot+' saved to this child.';
    } catch(e){ msg.style.color='var(--fail)'; msg.textContent=(e&&e.message)||String(e); }
  };
  window.viewSlot = async function(n){
    const p=slotEntry(n); const box=$('slot'+n); if(!p||!box) return;
    box.innerHTML='<div class="pItem">Image '+n+'<br>Opening\u2026</div>';
    try {
      const idToken = await auth.currentUser.getIdToken();
      const r = await fetch(VIEW_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken,contactId:current.contactId,storagePath:p.storagePath})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok||!j.url) throw new Error(j.error||'Could not open it.');
      box.innerHTML='<div class="pItem"><a href="'+j.url+'" target="_blank" rel="noopener"><img src="'+j.url+'" alt="Image '+n+'"></a><b>Image '+n+' \u2713</b><br><button type="button" onclick="pickSlot('+n+')">Replace</button></div>';
    } catch(e){ box.innerHTML='<div class="pItem">Image '+n+' <span style="color:var(--fail)">'+esc((e&&e.message)||'')+'</span></div>'; }
  };

  function val(id){ const e=$(id); return e?(e.value||'').trim():''; }

  window.saveEntry = async function(sendEmail){
    if(!current) return;
    const cur = current;
    const msg = $('entryMsg');
    // The family email waits until vision AND hearing are both done.
    if (sendEmail && !isComplete(mergeResults(cur.base, buildPatch(false)))){ msg.style.color='#b45309'; msg.textContent='Email unlocks when vision and hearing are both done.'; updateLock(); return; }
    msg.style.color='#64748b'; msg.textContent = sendEmail?'Saving & emailing…':'Saving…';
    saving = true; $('btnSave').disabled=true; $('btnEmail').disabled=true;
    const patch = buildPatch(true);
    const site = val('eSite'), screenedBy = val('eBy');
    try {
      let merged = cur.base;
      if (Object.keys(patch.fields).length){
        // TRANSACTION (2026-10-05): two stations can save the same child seconds
        // apart. Re-read the contact inside the transaction and merge ONLY the
        // fields this screener changed into the latest results; Firestore
        // retries if the doc changed underneath. Watchdog: never let a save hang
        // silently — if it doesn't finish in 15s, surface an error.
        const ref = db.collection('contacts').doc(cur.contactId);
        const doWrite = db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          if (!snap.exists) throw new Error('This contact was not found');
          const out = applyToScreening(((snap.data()||{}).screenings)||[], cur.screeningId, s => Object.assign({}, s, { results: mergeResults(s.results, patch) }));
          if (!out.found) throw new Error('This child\u2019s screening was not found');
          tx.update(ref, { screenings: out.list });
          return out.item.results;
        });
        merged = await Promise.race([ doWrite, new Promise((_,rej)=>setTimeout(()=>rej({ code:'timeout' }), 15000)) ]);
        // Saved: what is on screen is now the baseline.
        cur.base = merged; cur.touched = {};
        FORM_FIELDS.forEach(fd => { cur.initial[fd.id] = storedVal(merged, fd.path); });
      }
      // Remember Site + Screened by as today's defaults so they auto-fill on the
      // next child, on any browser (persisted server-side).
      dayDefaults = { site: site, screenedBy: screenedBy };
      db.collection('screeningDefaults').doc('current').set({ site: site, screenedBy: screenedBy, dateKey: todayKey(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
      if (sendEmail && !isComplete(merged)){
        saving = false; msg.style.color='#b45309'; msg.textContent='Saved, but not emailed: vision and hearing are not both done yet.';
        $('btnSave').disabled=false; updateLock(); return;
      }
      if (sendEmail){
        let idToken=''; try { idToken = await auth.currentUser.getIdToken(); } catch(_){}
        const res = await fetch(SEND_RESULTS, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ idToken, contactId:current.contactId, screeningId:current.screeningId }) });
        if (!res.ok){ let d=''; try{const j=await res.json(); d=j&&j.error?' ('+j.error+')':'';}catch(e){} msg.style.color='#b91c1c'; msg.textContent='Saved, but email failed'+d+'.'; saving=false; $('btnSave').disabled=false; $('btnEmail').disabled=false; updateLock(); return; }
        msg.style.color='#16a34a'; msg.textContent='Saved & emailed. ✓';
      } else { msg.style.color='#16a34a'; msg.textContent='Results saved. ✓'; }
      saving = false;
      setTimeout(()=>{ if (current === cur) closeEntry(); }, 800);
    } catch (ex){
      msg.style.color='#b91c1c';
      if (ex && ex.code==='timeout') msg.textContent = 'Save timed out — check your internet connection and try again. (Nothing was lost; just tap Save again.)';
      else if (ex && ex.code==='permission-denied') msg.textContent = 'Your account can’t save results (needs admin access — ask Daniel).';
      else msg.textContent = 'Error: '+((ex&&ex.message)||'could not save')+'. Please try again.';
      saving = false; $('btnSave').disabled=false; $('btnEmail').disabled=false; updateLock();
    }
  };
</script>
<div id="installHelp" hidden style="position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));">
  <div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:20px;">
    <h2 style="font-size:1.15rem;margin-bottom:8px;">Put Screenings on your home screen</h2>
    <ol id="installSteps" style="padding-left:20px;line-height:1.7;"></ol>
    <button id="installHelpClose" style="margin-top:14px;width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;font-size:1rem;">Got it</button>
  </div>
</div>
<script>
/* Install button (2026-10-05). Android/Chrome: Chrome's own install prompt.
   iPhone/iPad: Apple allows no button, so show the two taps instead.
   Hidden once it runs as the installed app. */
(function() {
  var btns = Array.prototype.slice.call(document.querySelectorAll('.installBtn')), help = document.getElementById('installHelp');
  if (!btns.length) return;
  var btn = { set hidden(v) { btns.forEach(function(b) { b.hidden = v; }); } };
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  window.__scrInstallShow = function() { if (!standalone) btn.hidden = false; };
  if (!standalone && (ios || window.__scrInstall)) btn.hidden = false;
  btns.forEach(function(b) { b.addEventListener('click', onInstall); });
  async function onInstall() {
    if (window.__scrInstall) {
      var ev = window.__scrInstall; ev.prompt();
      try { var r = await ev.userChoice; if (r && r.outcome === 'accepted') btn.hidden = true; } catch (e) {}
      window.__scrInstall = null; return;
    }
    var steps = document.getElementById('installSteps');
    steps.innerHTML = ios
      ? '<li>Tap the <b>Share</b> button (the square with an arrow' + (/iPad/.test(ua) || navigator.maxTouchPoints > 1 && /Macintosh/.test(ua) ? ', top right' : ', at the bottom') + ').</li><li>Tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. A <b>Screenings</b> icon appears on your home screen.</li>'
      : '<li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>&#8942;</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>).</li>';
    help.hidden = false;
  }
  document.getElementById('installHelpClose').addEventListener('click', function() { help.hidden = true; });
})();
</script>
