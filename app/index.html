<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get the LDAH App</title>
<meta name="description" content="Download the free LDAH app, or open it if you already have it.">
<!-- QR target on the printed brochure (2026-11-04). The store page itself shows
     OPEN when the app is already installed, so one scan covers both. -->
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var dest = ios ? 'https://apps.apple.com/us/app/ldah/id6760046576'
             : android ? 'https://play.google.com/store/apps/details?id=org.ldahawaii.app'
             : '/install.html';
    try { window.location.replace(dest); } catch (e) {}
  })();
</script>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAF3DD;color:#1E293B;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center}
  .c{max-width:420px}
  h1{font-size:1.4rem;color:#2C7B8D;margin:0 0 10px}
  p{margin:0 0 18px;color:#475569}
  a{display:block;margin:10px 0;padding:12px 16px;border-radius:10px;background:#2C7B8D;color:#fff;text-decoration:none;font-weight:700}
  a.alt{background:#fff;color:#2C7B8D;border:2px solid #2C7B8D}
</style>
</head>

  <a class="alt" href="/install.html">More ways to install</a>
</div>
</body>
</html>
