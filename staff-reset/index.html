<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Set a new password — LDAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Staff password reset (2026-10-19). Firebase's own reset page kept telling
  Chassidy her link was "used or expired": Microsoft 365 opens links in email
  before the person does. This page does NOTHING with the code when it loads;
  the code is only used when the person types a new password and presses Save
  (confirmPasswordReset), so a link scanner opening the page cannot use it up.
  Links are sent by Dan's script from registration@ldahawaii.org and point here
  with ?oobCode=...
-->
<style>
  :root { --blue:#0891B2; --blue-d:#0369A1; --ink:#1E293B; --soft:#64748B; --line:#E2E8F0; --bg:#F1F5F9; --pass:#16A34A; --fail:#B91C1C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--ink); background:var(--bg); display:flex; align-items:flex-start; justify-content:center; padding:32px 16px; }
  .card { width:100%; max-width:440px; background:#fff; border-radius:16px; box-shadow:0 10px 30px rgba(15,23,42,.10); overflow:hidden; }
  .top { text-align:center; padding:24px 24px 14px; }
  .top img { height:72px; }
  .band { background:#0E7490; color:#fff; font-family:'Outfit',sans-serif; font-weight:700; font-size:1.2rem; padding:14px 24px; }
  .body { padding:22px 24px 26px; }
  p { margin:0 0 14px; line-height:1.5; }
  .who { color:var(--soft); font-size:.95rem; }
  label { display:block; font-weight:700; font-size:.9rem; margin:14px 0 5px; }
  .pw { position:relative; }
  input { width:100%; font:inherit; font-size:1.05rem; padding:12px 64px 12px 13px; border:1.5px solid #CBD5E1; border-radius:11px; outline:none; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(8,145,178,.15); }
  .show { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--blue-d); font-weight:700; font-size:.85rem; cursor:pointer; padding:6px; }
  .rules { list-style:none; padding:0; margin:12px 0 0; font-size:.9rem; color:var(--soft); }
  .rules li { margin:3px 0; }
  .rules li::before { content:"○ "; }
  .rules li.ok { color:var(--pass); }
  .rules li.ok::before { content:"✓ "; font-weight:700; }
  button.go { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; background:var(--blue); color:#fff; font-family:'Outfit',sans-serif; font-weight:700; font-size:1.05rem; cursor:pointer; }
  button.go:disabled { background:#94A3B8; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:.95rem; min-height:1.2em; }
  .msg.bad { color:var(--fail); font-weight:600; }
  .done { text-align:center; }
  .done .tick { width:64px; height:64px; border-radius:50%; background:#DCFCE7; color:var(--pass); font-size:34px; font-weight:900; display:flex; align-items:center; justify-content:center; margin:4px auto 14px; }
  .done a { display:inline-block; margin-top:6px; padding:12px 26px; border-radius:12px; background:var(--blue); color:#fff; font-weight:700; text-decoration:none; font-family:'Outfit',sans-serif; }
  .foot { text-align:center; color:var(--soft); font-size:.8rem; padding:0 24px 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><img src="/logo_blue.png" alt="Leadership in Disabilities &amp; Achievement of Hawaiʻi"></div>
  <div class="band" id="band">Set a new password</div>
  <div class="body" id="body">
    <p>Choose a new password for your LDAH staff account. You will use it to sign in to DAN and the Screenings page.</p>
    <p class="who" id="who"></p>
    <form id="f" autocomplete="on" novalidate>
      <input type="text" name="username" id="uname" autocomplete="username" style="display:none">
      <label for="p1">New password</label>
      <div class="pw"><input type="password" id="p1" autocomplete="new-password" minlength="8" required><button type="button" class="show" data-for="p1">Show</button></div>
      <label for="p2">Type it again</label>
      <div class="pw"><input type="password" id="p2" autocomplete="new-password" minlength="8" required><button type="button" class="show" data-for="p2">Show</button></div>
      <ul class="rules"><li id="rLen">At least 8 characters</li><li id="rMatch">Both boxes match</li></ul>
      <button class="go" id="go" type="submit" disabled>Save new password</button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </form>
  </div>
  <div class="foot">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
(function(){
  firebase.initializeApp({
    apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
    authDomain: "ldah-932d5.firebaseapp.com",
    projectId: "ldah-932d5"
  });
  var auth = firebase.auth();
  var $ = function(id){ return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var code = qs.get('oobCode') || '';
  var email = qs.get('email') || '';
  // Keep the code out of the address bar, history and any later referrer.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var DAN = 'https://danpoahu.github.io/LDAH-Int/';
  function expired(){
    $('band').textContent = 'This link has expired';
    $('body').innerHTML = '<p>This password link has already been used, or it is more than an hour old.</p>' +
      '<p>Ask for a new one. Use only the newest email, and open it within the hour.</p>';
  }
  if (!code) { expired(); return; }
  if (email) { $('who').textContent = 'Account: ' + email; $('uname').value = email; }

  function check(){
    var a = $('p1').value, b = $('p2').value;
    var len = a.length >= 8, match = !!a && a === b;
    $('rLen').classList.toggle('ok', len);
    $('rMatch').classList.toggle('ok', match);
    $('go').disabled = !(len && match);
  }
  $('p1').addEventListener('input', check);
  $('p2').addEventListener('input', check);
  document.querySelectorAll('.show').forEach(function(b){
    b.addEventListener('click', function(){
      var i = $(b.getAttribute('data-for'));
      var hide = i.type === 'text';
      i.type = hide ? 'password' : 'text';
      b.textContent = hide ? 'Show' : 'Hide';
    });
  });

  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = $('p1').value;
    if (pw.length < 8 || pw !== $('p2').value) return;
    $('go').disabled = true; $('go').textContent = 'Saving…';
    $('msg').className = 'msg'; $('msg').textContent = '';
    // The ONLY place the code is used.
    auth.confirmPasswordReset(code, pw).then(function(){
      $('band').textContent = 'Password changed';
      $('body').innerHTML = '<div class="done"><div class="tick">✓</div>' +
        '<p>Your new password is saved. Sign in with it now.</p>' +
        '<a href="' + DAN + '">Sign in to DAN</a></div>';
    }).catch(function(err){
      var c = (err && err.code) || '';
      if (c === 'auth/expired-action-code' || c === 'auth/invalid-action-code') { expired(); return; }
      $('go').disabled = false; $('go').textContent = 'Save new password';
      $('msg').className = 'msg bad';
      $('msg').textContent = c === 'auth/weak-password' ? 'That password is too easy to guess. Try a longer one.'
        : c === 'auth/network-request-failed' ? 'No connection. Check your internet and press Save again.'
        : 'Could not save: ' + ((err && err.message) || 'please try again') + '.';
    });
  });
})();
</script>
</body>
</html>
